# CISNE Rondônia — Homologação (HML)
# Isolado de produção: DB, storage, secrets e URLs próprios.
# Uso: cp .env.hml.example .env.hml && docker compose -f docker/hml/compose.yaml --env-file .env.hml up -d --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: cisne_hml_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HML_POSTGRES_USER}
      POSTGRES_PASSWORD: ${HML_POSTGRES_PASSWORD}
      POSTGRES_DB: ${HML_POSTGRES_DB}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - cisne_hml_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [cisne_hml]

  api:
    build:
      context: ${CISNE_BACKEND_DIR:-../..}
      dockerfile: ${CISNE_API_DOCKERFILE:-docker/hml/Dockerfile.api}
    container_name: cisne_hml_api
    restart: unless-stopped
    env_file:
      - ${HML_ENV_FILE:-../../.env.hml}
    environment:
      DATABASE_URL: postgresql://${HML_POSTGRES_USER}:${HML_POSTGRES_PASSWORD}@postgres:5432/${HML_POSTGRES_DB}
      OBJECT_STORAGE_ROOT: /data/object-storage
      # Identidade do artefato em execução (endpoint /observability/artifact).
      ARTIFACT_RELEASE: ${ARTIFACT_RELEASE:-unknown}
      ARTIFACT_COMMIT: ${ARTIFACT_COMMIT:-unknown}
      ARTIFACT_BUILD: ${ARTIFACT_BUILD:-unknown}
    volumes:
      - cisne_hml_object_storage:/data/object-storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3100:3000'
    networks: [cisne_hml]

  web:
    build:
      context: ${CISNE_FRONTEND_DIR:-../..}
      dockerfile: ${CISNE_WEB_DOCKERFILE:-docker/hml/Dockerfile.web}
      args:
        VITE_API_BASE_URL: ${HML_PUBLIC_API_URL}
        # HML homologa o produto CONSTRUÍDO: defaults alinhados com a política de
        # `apps/web/src/release-scope/feature-flags.ts` e com `BUILT_MODULES`.
        #
        # FONTE ÚNICA: o arg do web deriva de `FEATURE_MODULE_*`, a MESMA variável que o
        # serviço `api` recebe por `env_file`. Antes o web usava `VITE_FEATURE_MODULE_*`
        # independente, e as duas famílias podiam divergir em silêncio: o menu publicava
        # um módulo que o guard do servidor recusava com 403 FEATURE_DISABLED.
        # A variável explícita `FEATURE_MODULE_*` continua vencendo o default.
        VITE_CISNE_SURFACE: ${VITE_CISNE_SURFACE:-hml}
        VITE_FEATURE_MODULE_FINANCE: ${FEATURE_MODULE_FINANCE:-true}
        VITE_FEATURE_MODULE_FISCAL: ${FEATURE_MODULE_FISCAL:-true}
        VITE_FEATURE_MODULE_ACCOUNTING: ${FEATURE_MODULE_ACCOUNTING:-true}
        VITE_FEATURE_MODULE_INVENTORY: ${FEATURE_MODULE_INVENTORY:-true}
        VITE_FEATURE_MODULE_PAYROLL: ${FEATURE_MODULE_PAYROLL:-true}
        VITE_FEATURE_MODULE_PROCUREMENT: ${FEATURE_MODULE_PROCUREMENT:-true}
        VITE_FEATURE_MODULE_SUPPLIERS: ${FEATURE_MODULE_SUPPLIERS:-true}
        VITE_FEATURE_MODULE_CONTRACTS: ${FEATURE_MODULE_CONTRACTS:-true}
        VITE_FEATURE_MODULE_PEOPLE: ${FEATURE_MODULE_PEOPLE:-true}
        VITE_FEATURE_MODULE_RENTALS: ${FEATURE_MODULE_RENTALS:-false}
        VITE_FEATURE_MODULE_TRANSPORT: ${FEATURE_MODULE_TRANSPORT:-false}
        VITE_FEATURE_MODULE_ALERTS: ${FEATURE_MODULE_ALERTS:-true}
        VITE_FEATURE_MODULE_REPORTS: ${FEATURE_MODULE_REPORTS:-true}
        VITE_FEATURE_MODULE_APPROVAL_MATRIX: ${FEATURE_MODULE_APPROVAL_MATRIX:-true}
        VITE_FEATURE_MODULE_OPERATIONAL_PROFITABILITY: ${FEATURE_MODULE_OPERATIONAL_PROFITABILITY:-true}
    container_name: cisne_hml_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5174:80'
    networks: [cisne_hml]

networks:
  cisne_hml:
    name: cisne_hml

volumes:
  cisne_hml_pg_data:
    name: cisne_hml_pg_data
  cisne_hml_object_storage:
    name: cisne_hml_object_storage
