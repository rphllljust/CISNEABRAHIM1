# CISNE Rondônia — Produção endurecida (referência)
# DB e object storage em rede interna; somente Caddy expõe 80/443.
# Secrets são montados em /run/secrets e nunca devem entrar no .env.prod.
# Consulte docker/prod/SECRETS.md antes de subir o stack.

services:
  postgres:
    image: postgres:18-alpine
    pull_policy: never
    container_name: cisne_prod_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${PROD_POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - cisne_prod_pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [cisne_prod_internal]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    pull_policy: never
    container_name: cisne_prod_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/s3_access_key_id
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_secret_access_key
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
    volumes:
      - cisne_prod_object_storage:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [cisne_prod_internal]

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-22T05-26-27Z
    pull_policy: never
    container_name: cisne_prod_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      S3_ACCESS_KEY_ID=$$(cat /run/secrets/s3_access_key_id) &&
      S3_SECRET_ACCESS_KEY=$$(cat /run/secrets/s3_secret_access_key) &&
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
      mc mb --ignore-existing local/$$OBJECT_STORAGE_BUCKET &&
      mc anonymous set none local/$$OBJECT_STORAGE_BUCKET &&
      mc version enable local/$$OBJECT_STORAGE_BUCKET &&
      mc ilm rule add --expire-days 365 local/$$OBJECT_STORAGE_BUCKET || true
      "
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
    secrets:
      - s3_access_key_id
      - s3_secret_access_key
    networks: [cisne_prod_internal]

  api:
    image: ${CISNE_API_IMAGE:-cisne-api:local}
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.api
    container_name: cisne_prod_api
    restart: unless-stopped
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
    secrets:
      - database_url
      - jwt_secret
      - document_download_token_secret
      - backup_encryption_key
      - s3_access_key_id
      - s3_secret_access_key
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [cisne_prod_internal]

  worker:
    image: ${CISNE_API_IMAGE:-cisne-api:local}
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.api
    container_name: cisne_prod_worker
    restart: unless-stopped
    command: ['node', 'dist/worker/main.js']
    env_file:
      - ../../.env.prod
    environment:
      NODE_ENV: production
      OUTBOX_PUBLISHER_ENABLED: 'true'
    secrets:
      - database_url
      - jwt_secret
      - backup_encryption_key
      - s3_access_key_id
      - s3_secret_access_key
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f "dist/worker/main.js" >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cisne_prod_internal]

  web:
    image: ${CISNE_WEB_IMAGE:-cisne-web:local}
    build:
      context: ../..
      dockerfile: docker/hml/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${PROD_PUBLIC_API_URL}
    container_name: cisne_prod_web
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    networks: [cisne_prod_internal]

  caddy:
    image: caddy:2.9-alpine
    pull_policy: never
    container_name: cisne_prod_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cisne_prod_caddy_data:/data
      - cisne_prod_caddy_config:/config
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      PROD_WEB_DOMAIN: ${PROD_WEB_DOMAIN}
    depends_on:
      - api
      - web
    networks: [cisne_prod_edge, cisne_prod_internal]

networks:
  cisne_prod_internal:
    name: cisne_prod_internal
    internal: true
  cisne_prod_edge:
    name: cisne_prod_edge

volumes:
  cisne_prod_pg_data:
    name: cisne_prod_pg_data
  cisne_prod_object_storage:
    name: cisne_prod_object_storage
  cisne_prod_caddy_data:
    name: cisne_prod_caddy_data
  cisne_prod_caddy_config:
    name: cisne_prod_caddy_config

secrets:
  postgres_password:
    file: ${PROD_POSTGRES_PASSWORD_SECRET_FILE:-../../secrets/prod/postgres_password}
  database_url:
    file: ${PROD_DATABASE_URL_SECRET_FILE:-../../secrets/prod/database_url}
  jwt_secret:
    file: ${PROD_JWT_SECRET_FILE:-../../secrets/prod/jwt_secret}
  document_download_token_secret:
    file: ${PROD_DOCUMENT_TOKEN_SECRET_FILE:-../../secrets/prod/document_download_token_secret}
  backup_encryption_key:
    file: ${PROD_BACKUP_ENCRYPTION_KEY_FILE:-../../secrets/prod/backup_encryption_key}
  s3_access_key_id:
    file: ${PROD_S3_ACCESS_KEY_ID_FILE:-../../secrets/prod/s3_access_key_id}
  s3_secret_access_key:
    file: ${PROD_S3_SECRET_ACCESS_KEY_FILE:-../../secrets/prod/s3_secret_access_key}
