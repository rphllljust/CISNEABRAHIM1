server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: rotas do React Router sao resolvidas pelo cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O entrypoint SPA nunca deve permanecer obsoleto entre releases.
  # Assets com hash continuam imutáveis e cacheáveis por um ano.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # CONFIG DE RUNTIME NUNCA PODE SER CACHEADA.
  #
  # `/runtime-config.js` e gerado a cada start do container a partir de
  # `CISNE_PUBLIC_API_URL` (envsubst). Ele diz ao browser para qual API chamar.
  #
  # DEFEITO MEDIDO: sem regra explicita, o browser aplicava cache heuristico. Um usuario que
  # ja tinha carregado a config antiga (`https://`, apontando para uma API que so serve HTTP)
  # continuaria com a tela de login quebrada mesmo depois de o servidor estar correto — o
  # sintoma sobreviveria ao deploy e pareceria "producao ainda quebrada".
  #
  # `no-store` (e nao apenas `no-cache`): este arquivo e a cola entre Web e API; um valor
  # obsoleto nao e degradacao, e indisponibilidade total de login.
  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    expires -1;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /health {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }
}
