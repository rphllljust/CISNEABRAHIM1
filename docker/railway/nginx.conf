server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: rotas do React Router sao resolvidas pelo cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O entrypoint SPA nunca deve permanecer obsoleto entre releases.
  # Assets com hash continuam imutáveis e cacheáveis por um ano.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /health {
    access_log off;
    return 200 'ok\n';
    add_header Content-Type text/plain;
  }
}
