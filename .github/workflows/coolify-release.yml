name: Coolify Release Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI run id whose Release Ready verdict authorizes publication
        required: true
        type: string

concurrency:
  group: coolify-release-images
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release-authority:
    name: Require Release Ready
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.authority.outputs.ci_run_id }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
    steps:
      - id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          # SHA do commit que esta execucao publica.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"

          # `workflow_run.id` aponta para o run de CI que DISPAROU o evento. Com dois
          # pushes proximos, esse run pode ser o que o `concurrency` do CI cancelou --
          # e entao `Release ready` aparece como `cancelled`/`failure` mesmo com a main
          # verde (foi observado: "publication refused: Release ready=failure" com a CI
          # do sha publicando corretamente). Em vez de confiar no id do evento,
          # resolvemos o run de CI CONCLUIDO MAIS RECENTE para o SHA esperado e so
          # aceitamos se `Release ready` daquele run for `success`.
          runs_json=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=$EXPECTED_SHA&per_page=100")

          selection=$(printf '%s' "$runs_json" | EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const expected=process.env.EXPECTED_SHA;
            const runs=(JSON.parse(s).workflow_runs ?? []).filter(
              (entry)=>entry.name==="CI" && entry.head_sha===expected,
            );
            if (runs.length===0) { console.log("MISSING"); process.exit(0); }
            const completed=runs.filter((entry)=>entry.status==="completed");
            const pool=completed.length>0 ? completed : runs;
            const run=pool.sort((a,b)=>b.id-a.id)[0];
            console.log([run.id, run.head_branch, run.status, run.conclusion ?? ""].join(" "));
          ')

          if [ "$selection" = "MISSING" ]; then
            echo "::error::publication refused: nenhum run de CI para $EXPECTED_SHA"
            exit 1
          fi

          read -r RUN_ID HEAD_BRANCH RUN_STATUS RUN_CONCLUSION <<< "$selection"

          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "::error::publication refused: CI run em '$HEAD_BRANCH' (esperado main)"
            exit 1
          fi
          if [ "$RUN_STATUS" != "completed" ]; then
            echo "::error::publication refused: CI run $RUN_ID ainda em '$RUN_STATUS'"
            exit 1
          fi

          # Fonte da verdade: o job `Release ready` daquele run.
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100")
          ready=$(printf '%s' "$jobs_json" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const jobs=JSON.parse(s).jobs ?? [];
            const job=jobs.find((entry)=>entry.name==="Release ready");
            process.stdout.write(job?.conclusion ?? job?.status ?? "MISSING");
          ')
          if [ "$ready" != "success" ]; then
            echo "::error::publication refused: Release ready=$ready (run $RUN_ID, CI=$RUN_CONCLUSION)"
            exit 1
          fi

          echo "ci_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "publication authorized: sha=$EXPECTED_SHA ci_run=$RUN_ID"

  publish:
    name: Publish immutable API/Web images
    runs-on: ubuntu-latest
    needs: release-authority
    env:
      REGISTRY: ghcr.io
      API_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cisne-api
      WEB_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cisne-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-authority.outputs.source_sha }}
          fetch-depth: 1

      - name: Download authorized CI artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.release-authority.outputs.ci_run_id }}
          name: cisne-build-${{ needs.release-authority.outputs.ci_run_id }}
          path: artifacts

      - id: provenance
        name: Verify immutable artifact provenance
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.release-authority.outputs.source_sha }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: api
        name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: artifacts/railway/release
          file: artifacts/railway/release/docker/hml/Dockerfile.api
          push: true
          tags: ${{ env.API_REPOSITORY }}:${{ needs.release-authority.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-authority.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - id: web
        name: Publish Web image
        uses: docker/build-push-action@v6
        with:
          context: artifacts/railway/release
          file: artifacts/railway/release/docker/railway/Dockerfile.web
          push: true
          tags: ${{ env.WEB_REPOSITORY }}:${{ needs.release-authority.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-authority.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Emit fail-closed Coolify deploy payload
        env:
          COOLIFY_SOURCE_SHA: ${{ needs.release-authority.outputs.source_sha }}
          COOLIFY_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
          COOLIFY_API_IMAGE: ${{ env.API_REPOSITORY }}@${{ steps.api.outputs.digest }}
          COOLIFY_WEB_IMAGE: ${{ env.WEB_REPOSITORY }}@${{ steps.web.outputs.digest }}
        run: node scripts/cd/coolify-deploy-payload.mjs

      - name: Upload Coolify deployment payload
        uses: actions/upload-artifact@v4
        with:
          name: coolify-release-${{ needs.release-authority.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/coolify/deploy-payload.json
