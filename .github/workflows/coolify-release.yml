name: Coolify Release Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Dispatch manual republica o SHA do ref selecionado. Nao existe override de
  # run id: a autoridade continua sendo o job `Release ready` do run de CI que o
  # seletor resolver para aquele SHA.
  workflow_dispatch:

concurrency:
  group: coolify-release-images
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  release-authority:
    name: Require Release Ready
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.authority.outputs.ci_run_id }}
      source_sha: ${{ steps.authority.outputs.source_sha }}
    steps:
      # Necessario porque o seletor de autoridade e um modulo versionado
      # (scripts/cd/select-authorizing-run.mjs) e nao um inline no YAML.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          # SHA do commit que esta execucao publica.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"

          # Contrato do seletor (fail-closed): workflow=CI, branch=main, sha=EXPECTED_SHA,
          # status=completed, conclusion=success; havendo varios, vale o success de maior
          # id. Depois exige o job `Release ready` = success. Qualquer outro conjunto
          # (so cancelado, so failure, so in_progress, nenhum, outro workflow) recusa.
          runs_json=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=$EXPECTED_SHA&per_page=100")
          printf '%s' "$runs_json" > /tmp/ci-runs.json

          if ! RUN_ID=$(EXPECTED_SHA="$EXPECTED_SHA" EXPECTED_RUNS_FILE=/tmp/ci-runs.json \
              node scripts/cd/select-authorizing-run.mjs 2>/tmp/selector.err); then
            echo "::error::publication refused: $(cat /tmp/selector.err)"
            exit 1
          fi
          test -n "$RUN_ID"

          # Fonte da verdade: o job `Release ready` daquele run.
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100")
          ready=$(printf '%s' "$jobs_json" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const jobs=JSON.parse(s).jobs ?? [];
            const job=jobs.find((entry)=>entry.name==="Release ready");
            process.stdout.write(job?.conclusion ?? job?.status ?? "MISSING");
          ')
          if [ "$ready" != "success" ]; then
            echo "::error::publication refused: Release ready=$ready (run $RUN_ID)"
            exit 1
          fi

          echo "ci_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "publication authorized: sha=$EXPECTED_SHA ci_run=$RUN_ID"

  publish:
    name: Publish immutable API/Web images
    runs-on: ubuntu-latest
    needs: release-authority
    env:
      REGISTRY: ghcr.io
      API_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cisne-api
      WORKER_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cisne-worker
      WEB_REPOSITORY: ghcr.io/${{ github.repository_owner }}/cisne-web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-authority.outputs.source_sha }}
          fetch-depth: 1

      - name: Download authorized CI artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.release-authority.outputs.ci_run_id }}
          name: cisne-build-${{ needs.release-authority.outputs.ci_run_id }}
          path: artifacts

      - id: provenance
        name: Verify immutable artifact provenance
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.release-authority.outputs.source_sha }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - id: api
        name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: artifacts/release
          file: artifacts/release/docker/release/Dockerfile.api
          push: true
          tags: ${{ env.API_REPOSITORY }}:${{ needs.release-authority.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-authority.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - id: web
        name: Publish Web image
        uses: docker/build-push-action@v6
        with:
          context: artifacts/release
          file: artifacts/release/docker/release/Dockerfile.web
          push: true
          tags: ${{ env.WEB_REPOSITORY }}:${{ needs.release-authority.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-authority.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # O worker compartilha o MESMO codigo da API, mas executa outro processo.
      #
      # POR QUE ESTA IMAGEM EXISTE (medido no Coolify 4.4.7): com
      # build_pack=dockerimage NENHUM campo da API materializa `command:` no
      # compose gerado -- start_command e docker_compose_custom_start_command sao
      # ignorados, custom_docker_run_options gera apenas `entrypoint` (Cmd=null) e
      # docker_compose_raw e proibido em applications. O processo e sempre o CMD
      # da imagem, entao o worker precisa de uma imagem com CMD proprio.
      #
      # Derivar da imagem da API garante bits identicos; so o CMD muda.
      - id: worker
        name: Publish Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/release/Dockerfile.worker
          build-args: |
            CISNE_API_IMAGE=${{ env.API_REPOSITORY }}@${{ steps.api.outputs.digest }}
          push: true
          tags: ${{ env.WORKER_REPOSITORY }}:${{ needs.release-authority.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-authority.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Emit fail-closed Coolify deploy payload
        env:
          COOLIFY_SOURCE_SHA: ${{ needs.release-authority.outputs.source_sha }}
          COOLIFY_ARTIFACT_DIGEST: ${{ steps.provenance.outputs.artifact_digest }}
          COOLIFY_API_IMAGE: ${{ env.API_REPOSITORY }}@${{ steps.api.outputs.digest }}
          COOLIFY_WORKER_IMAGE: ${{ env.WORKER_REPOSITORY }}@${{ steps.worker.outputs.digest }}
          COOLIFY_WEB_IMAGE: ${{ env.WEB_REPOSITORY }}@${{ steps.web.outputs.digest }}
        run: node scripts/cd/coolify-deploy-payload.mjs

      - name: Upload Coolify deployment payload
        uses: actions/upload-artifact@v4
        with:
          name: coolify-release-${{ needs.release-authority.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 30
          path: artifacts/coolify/deploy-payload.json

      # Ultimo metro do release: materializa o payload no runtime real.
      #
      # Coolify continua dono do runtime. Nada aqui faz git pull, build no VPS,
      # docker pull manual ou compose manual -- apenas a API oficial v1:
      # PATCH da imagem imutavel por digest + POST /deploy + estado terminal.
      #
      # Fail-closed: sem COOLIFY_TOKEN/UUIDs o step falha (o secret e obrigatorio
      # para o deploy ser real). O deploy recusa tag mutavel e recusa worker com
      # digest diferente da API.
      - name: Deploy authorized digests to Coolify
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          COOLIFY_DEPLOY_PAYLOAD: artifacts/coolify/deploy-payload.json
        run: node scripts/cd/coolify-deploy.mjs

      - name: Verify production runtime and authenticated smoke
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          COOLIFY_SOURCE_SHA: ${{ needs.release-authority.outputs.source_sha }}
          PROD_SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: node scripts/cd/coolify-postdeploy-smoke.mjs
