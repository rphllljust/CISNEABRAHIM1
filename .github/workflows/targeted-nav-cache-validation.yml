name: Targeted Nav Cache Validation

on:
  push:
    branches:
      - 'rc/nav-surface-cache-20261012'

permissions:
  contents: read

jobs:
  validate:
    name: Focused shell cache gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused lint
        run: pnpm exec eslint apps/web/src/shell/useNavAccess.ts apps/web/src/shell/useNavAccessContract.test.tsx

      - name: Web typecheck
        run: pnpm --filter @cisne/web typecheck

      - name: Focused test
        run: pnpm --filter @cisne/web exec vitest run --config vite.config.ts src/shell/useNavAccessContract.test.tsx

      - name: Production web build
        run: pnpm --filter @cisne/web build

      - name: Diff check
        run: git diff --check HEAD~2 HEAD~1 -- apps/web/src/shell/useNavAccess.ts apps/web/src/shell/useNavAccessContract.test.tsx
