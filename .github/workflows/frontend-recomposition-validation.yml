name: Frontend recomposition validation

on:
  push:
    branches:
      - 'validation/frontend-recomposition-20261015'
      - 'theme/midnight-completion'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/e2e/proof/midnight-theme.spec.ts'

permissions:
  contents: read

concurrency:
  group: frontend-recomposition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-web-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused lint
        working-directory: apps/web
        run: |
          mapfile -t changed < <(git diff --name-only c87fa4559153f19aa4bfdfca7000523061c4cc1e HEAD -- src e2e | sed -n '/\.tsx\?$/p' | sed 's|^apps/web/||')
          test "${#changed[@]}" -gt 0
          pnpm exec eslint "${changed[@]}"
      - name: Web typecheck
        run: pnpm --filter @cisne/web typecheck
      - name: Focused interaction contracts
        run: >-
          pnpm --filter @cisne/web exec vitest run --config vite.config.ts
          src/ui/workspace-recomposition.test.tsx
          src/enterprise-object/enterprise-object.contract.test.tsx
          src/enterprise-object/propagation.ui.test.tsx
          src/dashboard/components/cockpit-structure.test.tsx
          src/shell/shell.components.test.tsx
      - name: Build web
        env:
          VITE_CISNE_SURFACE: dev
        run: pnpm --filter @cisne/web build
      - name: Install browser
        run: pnpm --filter @cisne/web exec playwright install --with-deps chromium
      - name: Midnight theme browser acceptance
        working-directory: apps/web
        run: |
          pnpm run preview:visual > ../../tmp-preview.log 2>&1 &
          pnpm exec playwright test --config e2e/proof/playwright.proof.config.ts midnight-theme.spec.ts
      - name: Upload theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: midnight-theme-evidence
          path: |
            apps/web/tmp-proof/midnight-*.png
            apps/web/test-results-proof/
          if-no-files-found: ignore
      - name: Diff check
        run: git diff --check c87fa4559153f19aa4bfdfca7000523061c4cc1e HEAD
