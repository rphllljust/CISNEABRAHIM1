name: MASTER 015 — Coolify Superset HML Compose scaffold

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: master-015-hml-compose-scaffold
  cancel-in-progress: false

jobs:
  create-undeployed-application:
    name: Coolify HML — create Superset Compose application (NO DEPLOY)
    if: github.repository == 'rphllljust/CISNEABRAHIM1' && github.actor == 'rphllljust' && github.ref == 'refs/heads/ops/master-015-hml-access-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test exact HML and no-auto-deployment guard
        run: |
          node --check infra/superset/tools/coolify-hml-create-compose-app.mjs
          node --test infra/superset/tools/coolify-hml-create-compose-app.test.mjs
      - name: Create HML-only Compose application with deployment disabled
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
          HML_COMPOSE_ACTION: CREATE_UNDEPLOYED_IF_SAFE
        run: node infra/superset/tools/coolify-hml-create-compose-app.mjs
