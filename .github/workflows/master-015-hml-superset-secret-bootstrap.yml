name: MASTER 015 — Coolify Superset HML secret bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - ops/master-015-hml-access-probe
    paths:
      - '.github/workflows/master-015-hml-superset-secret-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: master-015-hml-secret-bootstrap
  cancel-in-progress: false

jobs:
  secrets-only:
    name: Configure new HML Superset secrets without deployment
    if: github.repository == 'rphllljust/CISNEABRAHIM1' && github.actor == 'rphllljust' && github.ref == 'refs/heads/ops/master-015-hml-access-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test TLS, HML scope, no rotation and no disclosure
        run: |
          node --check infra/superset/tools/coolify-hml-configure-secrets.mjs
          node --test infra/superset/tools/coolify-hml-configure-secrets.test.mjs
      - name: Configure exactly four variables on the new undeployed HML application
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          HML_SECRET_ACTION: CONFIGURE_ONLY_WITHOUT_DEPLOY
        run: node infra/superset/tools/coolify-hml-configure-secrets.mjs
