name: CISNE Frontend V2 isolated validation

on:
  pull_request:
    paths:
      - 'frontend-v2/**'
      - '.github/workflows/frontend-v2-validation.yml'
  push:
    branches:
      - feat/cisne-frontend-v2-shadcn-isolado
    paths:
      - 'frontend-v2/**'
      - '.github/workflows/frontend-v2-validation.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Frontend V2 / Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: CISNE BFF security unit tests
        run: bun test tests/cisne.security.test.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Next build
        run: bun run build
