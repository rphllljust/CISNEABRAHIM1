name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run id to promote (defaults to triggering run)
        required: false

concurrency:
  group: cd-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_COLOR: '1'

jobs:
  resolve-ci-artifact:
    name: Resolve CI artifact (build once)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      artifact_digest: ${{ steps.provenance.outputs.artifact_digest }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "ci_run_id=${{ inputs.ci_run_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "ci_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download CI build artifact (no rebuild)
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.ci_run_id }}
          name: cisne-build-${{ steps.resolve.outputs.ci_run_id }}
          path: ${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}

      - id: source
        name: Resolve immutable source SHA
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const manifest = JSON.parse(readFileSync(resolve(process.env.ARTIFACT_ROOT, 'artifacts/cd/deploy-manifest.json'), 'utf8'));
          const sourceSha = manifest.commitSha;
          if (typeof sourceSha !== 'string' || !/^[0-9a-f]{40}$/i.test(sourceSha)) {
            throw new Error(`Invalid MANIFEST_SHA: ${String(sourceSha)}`);
          }
          if (process.env.WORKFLOW_SOURCE_SHA && process.env.WORKFLOW_SOURCE_SHA !== sourceSha) {
            throw new Error(`SOURCE_SHA/MANIFEST_SHA mismatch: source=${process.env.WORKFLOW_SOURCE_SHA} manifest=${sourceSha}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${sourceSha}\n`, 'utf8');
          NODE

      - name: Checkout exact manifest source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1

      - name: Restore CI artifact into workspace
        run: cp -a "${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}/." .

      - id: provenance
        name: Verify immutable build provenance
        env:
          PROVENANCE_EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Upload promotion bundle
        uses: actions/upload-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}
          retention-days: 30
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            apps/api/dist
            apps/web/dist
            packages/database/dist
            packages/database/migrations
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            apps/api/package.json
            apps/web/package.json
            packages/database/package.json
            packages/eslint-config/package.json
            packages/tsconfig/package.json
            docker/release/Dockerfile.api
            docker/release/Dockerfile.web
            docker/railway/nginx.conf

  deploy-hml:
    name: Deploy immutable release to Railway HML
    runs-on: ubuntu-latest
    needs: resolve-ci-artifact
    timeout-minutes: 35
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || 'feededf6-22ad-4f3e-b8d3-2ba577149d89' }}
      RAILWAY_PRODUCTION_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID || '607953af-ae54-4aa2-a5cc-88fc0fe6247d' }}
      RAILWAY_HML_ENVIRONMENT_NAME: hml
      RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID || '9a8120f5-1b31-4ca2-8f85-7bfcc78c1c4e' }}
      RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID || '6c3a12aa-4287-4144-9a78-7a38aba2e270' }}
      RAILWAY_POSTGRES_SERVICE_ID: ${{ vars.RAILWAY_POSTGRES_SERVICE_ID || 'dff29aaa-9d59-42eb-a479-5f93ebbc359e' }}
      CD_COMMIT_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
      CD_ARTIFACT_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
      CD_BUILD_RUN_ID: ${{ needs.resolve-ci-artifact.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Download promotion bundle
        uses: actions/download-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}

      - name: Verify HML provenance and artifact digest
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          PROVENANCE_EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Prepare immutable Railway release root
        run: node scripts/cd/railway-immutable-release.mjs

      - name: Install runtime tooling
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          npm install --global @railway/cli@5.23.3

      - id: hml
        name: Ensure isolated Railway HML environment and Postgres
        run: node scripts/cd/railway-ensure-hml.mjs

      - name: Deploy API immutable runtime bundle to HML
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
        run: |
          railway up artifacts/railway/release --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$HML_ENV_ID" \
            --service "$RAILWAY_API_SERVICE_ID" \
            --message "CISNE HML ${{ needs.resolve-ci-artifact.outputs.source_sha }} ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"

      - name: Deploy Web immutable runtime bundle to HML
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
        run: |
          railway up artifacts/railway/release --path-as-root \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$HML_ENV_ID" \
            --service "$RAILWAY_WEB_SERVICE_ID" \
            --message "CISNE HML ${{ needs.resolve-ci-artifact.outputs.source_sha }} ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"

      - id: hml-domains
        name: Resolve HML public domains
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
        run: |
          railway domain --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_API_SERVICE_ID" --json > /tmp/hml-api-domain.json
          railway domain --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_WEB_SERVICE_ID" --json > /tmp/hml-web-domain.json
          echo "api_url=$(node scripts/cd/extract-railway-domain.mjs /tmp/hml-api-domain.json)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(node scripts/cd/extract-railway-domain.mjs /tmp/hml-web-domain.json)" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral HML smoke credential
        run: |
          HML_LOGIN="hml-cd-${GITHUB_RUN_ID}@cisne.invalid"
          HML_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$HML_PASSWORD"
          echo "HML_SMOKE_LOGIN=$HML_LOGIN" >> "$GITHUB_ENV"
          echo "HML_SMOKE_PASSWORD=$HML_PASSWORD" >> "$GITHUB_ENV"

      - name: Bootstrap synthetic HML operator
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
          HML_SYNTHETIC_SEED_CONFIRM: I_UNDERSTAND
          BOOTSTRAP_CONFIRM: I_UNDERSTAND
          BOOTSTRAP_ADMIN_LOGIN: ${{ env.HML_SMOKE_LOGIN }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ env.HML_SMOKE_PASSWORD }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_API_SERVICE_ID" \
            node scripts/hml/bootstrap-synthetic.mjs

      - name: HML readiness and authenticated smoke
        env:
          HML_PUBLIC_API_URL: ${{ steps.hml-domains.outputs.api_url }}
        run: |
          curl -fsS "$HML_PUBLIC_API_URL/api/v1/health/ready"
          pnpm --filter @cisne/api hml:smoke

      - name: Prove HML SHA and digest from deployed Web bits
        env:
          HML_PUBLIC_WEB_URL: ${{ steps.hml-domains.outputs.web_url }}
          EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
        run: |
          curl -fsS "$HML_PUBLIC_WEB_URL/release-manifest.json" -o /tmp/hml-release.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('/tmp/hml-release.json', 'utf8'));
          if (manifest.commitSha !== process.env.EXPECTED_SHA || manifest.artifactDigest !== process.env.EXPECTED_DIGEST) {
            throw new Error(`DEPLOY REFUSED: HML provenance mismatch sha=${manifest.commitSha} digest=${manifest.artifactDigest}`);
          }
          console.log(`HML_SHA=${manifest.commitSha} HML_DIGEST=${manifest.artifactDigest}`);
          NODE

      - name: HML deployment evidence
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
        run: |
          railway deployment list --json --limit 1 --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_API_SERVICE_ID"
          railway deployment list --json --limit 1 --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_WEB_SERVICE_ID"

  acceptance:
    name: Acceptance gate
    runs-on: ubuntu-latest
    needs: deploy-hml
    steps:
      - run: echo "HML smoke passed — acceptance gate open for production promotion"

  deploy-production:
    name: Promote to production (manual gate)
    runs-on: ubuntu-latest
    needs: [acceptance, resolve-ci-artifact]
    environment: production
    env:
      PRD_PROMOTION_APPROVED: I_UNDERSTAND
      CD_REQUIRE_SECRET_STORE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Download promotion bundle (same artifact digest)
        uses: actions/download-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}

      - name: Verify production provenance and artifact digest
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          PROVENANCE_EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Prepare immutable Railway release root
        run: node scripts/cd/railway-immutable-release.mjs

      - name: Install Railway CLI
        run: npm install --global @railway/cli@latest

      - name: Promote API immutable runtime bundle to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || 'feededf6-22ad-4f3e-b8d3-2ba577149d89' }}
          RAILWAY_PRODUCTION_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID || '607953af-ae54-4aa2-a5cc-88fc0fe6247d' }}
          RAILWAY_API_SERVICE_ID: ${{ vars.RAILWAY_API_SERVICE_ID || '9a8120f5-1b31-4ca2-8f85-7bfcc78c1c4e' }}
        run: |
          cp docker/release/Dockerfile.api artifacts/railway/release/docker/hml/Dockerfile.api
          railway variable set CISNE_RELEASE_SHA="${{ needs.resolve-ci-artifact.outputs.source_sha }}" CISNE_RELEASE_DIGEST="${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"             --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" --service "$RAILWAY_API_SERVICE_ID" --skip-deploys
          railway up artifacts/railway/release --path-as-root --ci             --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID"             --service "$RAILWAY_API_SERVICE_ID"             --message "CISNE PROD ${{ needs.resolve-ci-artifact.outputs.source_sha }} ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"

      - name: Promote Web immutable runtime bundle to production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID || 'feededf6-22ad-4f3e-b8d3-2ba577149d89' }}
          RAILWAY_PRODUCTION_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID || '607953af-ae54-4aa2-a5cc-88fc0fe6247d' }}
          RAILWAY_WEB_SERVICE_ID: ${{ vars.RAILWAY_WEB_SERVICE_ID || '6c3a12aa-4287-4144-9a78-7a38aba2e270' }}
        run: |
          cp docker/release/Dockerfile.web artifacts/railway/release/docker/railway/Dockerfile.web
          railway variable set CISNE_RELEASE_SHA="${{ needs.resolve-ci-artifact.outputs.source_sha }}" CISNE_RELEASE_DIGEST="${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"             --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" --service "$RAILWAY_WEB_SERVICE_ID" --skip-deploys
          railway up artifacts/railway/release --path-as-root --ci             --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID"             --service "$RAILWAY_WEB_SERVICE_ID"             --message "CISNE PROD ${{ needs.resolve-ci-artifact.outputs.source_sha }} ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}"

      - name: Record production manifest
        run: cat artifacts/cd/deploy-manifest.json
