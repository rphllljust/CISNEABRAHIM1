name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI workflow run id to promote (defaults to triggering run)
        required: false

# CONCORRENCIA DO CD — grupo UNICO de producao, nunca compartilhado com o CI.
#
# O QUE ESTAVA ERRADO
#
# A formula anterior era `cd-${{ github.event.workflow_run.id || github.run_id }}`: um grupo
# DIFERENTE por run. Na pratica isso nao serializava nada — dois runs de CD disparados por dois
# pushes em `main` rodavam em PARALELO, cada um promovendo a sua release para o mesmo ambiente
# de producao. Com `cancel-in-progress: false` e grupos distintos, nenhum esperava ninguem:
# duas promocoes concorrentes, API e Web de SHAs potencialmente diferentes.
#
# POLITICA ATUAL
#
#   grupo `cd-production`, `cancel-in-progress: false`.
#
#   - CD NAO e cancelado por commit novo, por CI novo ou por outro CD: uma release que ja
#     comecou a promover HML nunca e interrompida no meio (interromper deixaria HML e producao
#     em estados diferentes, que e exatamente o que a promocao imutavel existe para impedir).
#   - A PROXIMA release ESPERA a atual terminar: mesmo grupo + `cancel-in-progress: false`
#     significa fila, nao paralelismo.
#   - O grupo NAO tem relacao com `ci-main`/`ci-pr-*`: o CI pode ser cancelado a vontade sem
#     tocar em nada que esteja promovendo.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_COLOR: '1'
  RAILWAY_PROJECT_ID: feededf6-22ad-4f3e-b8d3-2ba577149d89
  RAILWAY_PRODUCTION_ENVIRONMENT_ID: 607953af-ae54-4aa2-a5cc-88fc0fe6247d
  RAILWAY_POSTGRES_SERVICE_ID: dff29aaa-9d59-42eb-a479-5f93ebbc359e
  RAILWAY_WEB_SERVICE_ID: 6c3a12aa-4287-4144-9a78-7a38aba2e270
  RAILWAY_API_SERVICE_ID: 9a8120f5-1b31-4ca2-8f85-7bfcc78c1c4e

jobs:
  release-authority:
    name: Assert release-ready authority
    runs-on: ubuntu-latest
    # AUTORIDADE DE RELEASE — o UNICO criterio que autoriza o CD.
    #
    # Antes: o CD se pendenurava em `workflow_run.conclusion == 'success'`, que significa
    # apenas "os jobs que rodaram passaram". Um job required que nao rodou (condicao nao
    # satisfeita, matriz vazia, cancelamento) NAO aparece na conclusao — e a release passava
    # sem ele. "A CI passou" nao e a mesma afirmacao que "a release esta pronta".
    #
    # Agora o CD LE o veredito do job `release-ready` do run de CI e exige `success` explicito.
    # Se o job nao existir (run antigo, antes desta arquitetura) ou nao tiver sucesso, o deploy
    # e recusado — fail-closed.
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    outputs:
      authorized: ${{ steps.assert.outputs.authorized }}
      ci_run_id: ${{ steps.assert.outputs.ci_run_id }}
    steps:
      - id: assert
        name: Require release-ready == success
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          # Mesma causa do coolify-release.yml: `workflow_run.id` aponta para o run de CI
          # que disparou o evento, e o `concurrency` do CI pode ter cancelado esse run
          # quando dois pushes chegam proximos. Resolvemos pelo SHA.
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.ci_run_id }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA" ]; then
            echo "::error::No CI run id to resolve release authority from."
            exit 1
          fi

          # No dispatch manual o input E o run id; no evento e o SHA do push.
          if [ "$IS_DISPATCH" = "true" ]; then
            RUN_ID="$EXPECTED_SHA"
          else
            runs_json=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=$EXPECTED_SHA&per_page=100")
            selection=$(printf '%s' "$runs_json" | EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e '
              let s=""; for await (const c of process.stdin) s+=c;
              const expected=process.env.EXPECTED_SHA;
              const runs=(JSON.parse(s).workflow_runs ?? []).filter(
                (entry)=>entry.name==="CI" && entry.head_sha===expected,
              );
              if (runs.length===0) { console.log("MISSING"); process.exit(0); }
              const completed=runs.filter((entry)=>entry.status==="completed");
              const pool=completed.length>0 ? completed : runs;
              const run=pool.sort((a,b)=>b.id-a.id)[0];
              console.log([run.id, run.head_branch, run.status].join(" "));
            ')
            if [ "$selection" = "MISSING" ]; then
              echo "::error::No completed CI run for $EXPECTED_SHA"
              exit 1
            fi
            read -r RUN_ID HEAD_BRANCH RUN_STATUS <<< "$selection"
            if [ "$HEAD_BRANCH" != "main" ]; then
              echo "::error::CI run $RUN_ID is on '$HEAD_BRANCH' (expected main)"
              exit 1
            fi
            if [ "$RUN_STATUS" != "completed" ]; then
              echo "::error::CI run $RUN_ID still '$RUN_STATUS'"
              exit 1
            fi
          fi

          echo "ci_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          # A autoridade vem do JOB, nao da conclusao do run.
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs?per_page=100")
          ready=$(printf '%s' "$jobs_json" | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const jobs = JSON.parse(raw).jobs ?? [];
            const job = jobs.find((entry) => entry.name === "Release ready");
            if (!job) { console.log("MISSING"); process.exit(0); }
            console.log(`${job.conclusion ?? job.status}`);
          ')

          echo "release-ready job: $ready"
          if [ "$ready" != "success" ]; then
            echo "::error::DEPLOY REFUSED — release-ready concluded '$ready', not 'success'. A release pode ser promovida apenas por veredito explicito de release-ready."
            exit 1
          fi
          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "release authority granted for CI run $RUN_ID (sha ${WORKFLOW_SHA:-dispatch})"

  credentials-preflight:
    name: Require deployment credentials
    runs-on: ubuntu-latest
    # Roda DEPOIS de `release-authority` (nao ha deploy a provisionar se a release nao foi
    # autorizada) e ANTES de `resolve-ci-artifact`. Nada de caro acontece antes dele.
    needs: release-authority
    if: needs.release-authority.outputs.authorized == 'true'
    # PREFLIGHT DE CREDENCIAIS — a primeira coisa que roda no CD.
    #
    # O DEFEITO QUE ISSO ELIMINA
    #
    # Medido no run 39696441128: o CD percorreu `release-authority`, `resolve-ci-artifact`,
    # download do bundle, `verify-provenance`, testes de release e o MIGRATION GATE inteiro —
    # e so entao falhou com `RAILWAY_API_TOKEN is required`, porque a secret nunca foi criada.
    #
    # Custo de descobrir tarde: um run de CD completo (e, no pior caso, um novo ciclo
    # CI -> release-ready) antes de a falta de credencial aparecer. Credencial ausente e um
    # problema de PROVISIONAMENTO, conhecido antes de qualquer trabalho: deve falhar no segundo
    # zero, nao no minuto 40.
    #
    # LISTA COMPLETA E FECHADA: estas sao TODAS as credenciais que o CD consome. Auditar aqui
    # significa nunca mais descobrir uma secret faltando no meio da promocao.
    #
    #   RAILWAY_TOKEN        — Railway CLI/API em HML e producao (token unico; a mesma autoridade
    #                          era referenciada como RAILWAY_API_TOKEN e RAILWAY_TOKEN)
    #   PROD_SMOKE_LOGIN     — operador do smoke autenticado
    #   PROD_SMOKE_PASSWORD  — senha do mesmo operador
    #
    # NAO imprime valor algum: so diz QUAL nome falta.
    steps:
      - name: Check required secrets are provisioned
        env:
          RAILWAY_TOKEN_VALUE: ${{ secrets.RAILWAY_TOKEN }}
          SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for pair in \
            "RAILWAY_TOKEN:$RAILWAY_TOKEN_VALUE" \
            "PROD_SMOKE_LOGIN:$SMOKE_LOGIN" \
            "PROD_SMOKE_PASSWORD:$SMOKE_PASSWORD"
          do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::missing required secret '$name' — provision it before releasing"
              missing="$missing $name"
            else
              echo "ok: $name is provisioned"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::DEPLOY REFUSED — missing secrets:$missing"
            exit 1
          fi
          echo "credentials preflight: all required secrets present"

  resolve-ci-artifact:
    name: Resolve CI artifact (build once)
    runs-on: ubuntu-latest
    # DUAS dependencias REAIS, ambas consumidas de fato:
    #   credentials-preflight - porta: sem credencial nao ha deploy a resolver
    #   release-authority     - fonte do ci_run_id, usado no step de resolve abaixo
    #
    # ANTES: apenas credentials-preflight. Como release-authority saiu do needs ao inserir o
    # preflight, needs.release-authority.outputs.ci_run_id passou a resolver VAZIO - em GitHub
    # Actions o output de um job so existe para quem o declara em needs. O download tentava
    # "cisne-build-" (sem id). Medido no run 39701916347:
    #   ##[error]Unable to download artifact(s): Not Found
    needs: [credentials-preflight, release-authority]
    if: needs.credentials-preflight.result == 'success' && needs.release-authority.outputs.authorized == 'true'
    outputs:
      ci_run_id: ${{ steps.resolve.outputs.ci_run_id }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
      artifact_digest: ${{ steps.provenance.outputs.artifact_digest }}
    steps:
      - id: resolve
        run: |
          # Consome exatamente o run de CI cuja release-ready autorizou a promocao.
          echo "ci_run_id=${{ needs.release-authority.outputs.ci_run_id }}" >> "$GITHUB_OUTPUT"

      - name: Download CI immutable release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.ci_run_id }}
          name: cisne-build-${{ steps.resolve.outputs.ci_run_id }}
          # O artefato cisne-build publica `cd/`, `ci/` e `railway/` na raiz do
          # zip. O upload do CI inclui o prefixo `artifacts/...`, que o
          # upload-artifact remove. Baixar sob um diretório `artifacts` recriava
          # o prefixo e o manifest virava `artifacts/artifacts/cd/...` (ENOENT
          # em produção). A raiz baixada passa a ser o próprio ARTIFACT_ROOT;
          # o restore recoloca o prefixo `artifacts/` esperado pelos scripts.
          path: ${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}

      - id: source
        name: Resolve immutable source SHA
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}
          WORKFLOW_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          const manifest = JSON.parse(readFileSync(resolve(process.env.ARTIFACT_ROOT, 'cd/deploy-manifest.json'), 'utf8'));
          const sourceSha = manifest.commitSha;
          if (typeof sourceSha !== 'string' || !/^[0-9a-f]{40}$/i.test(sourceSha)) throw new Error('Invalid MANIFEST_SHA');
          if (process.env.WORKFLOW_SOURCE_SHA && process.env.WORKFLOW_SOURCE_SHA !== sourceSha) {
            throw new Error(`SOURCE_SHA/MANIFEST_SHA mismatch: source=${process.env.WORKFLOW_SOURCE_SHA} manifest=${sourceSha}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${sourceSha}\n`, 'utf8');
          NODE

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          fetch-depth: 1

      - name: Restore immutable release into workspace
        run: cp -a "${{ runner.temp }}/cisne-build-${{ steps.resolve.outputs.ci_run_id }}/." artifacts/

      - id: provenance
        name: Verify immutable build provenance
        env:
          PROVENANCE_EXPECTED_SHA: ${{ steps.source.outputs.source_sha }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Upload promotion bundle
        uses: actions/upload-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}
          retention-days: 30
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            artifacts/railway/release

  deploy-hml:
    name: Railway HML / migrations / readiness / authenticated smoke
    runs-on: ubuntu-latest
    needs: resolve-ci-artifact
    timeout-minutes: 40
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_HML_ENVIRONMENT_NAME: hml
      CD_COMMIT_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
      CD_ARTIFACT_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
      CD_BUILD_RUN_ID: ${{ needs.resolve-ci-artifact.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies for policy and smoke only
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3

      - name: Download promotion bundle
        uses: actions/download-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}
          # MESMA ARMADILHA CORRIGIDA EM `resolve-ci-artifact`, e repetida aqui.
          #
          # `upload-artifact` remove o prefixo comum dos paths declarados. O bundle e upado com
          # `artifacts/ci/build-metadata.json`, `artifacts/cd/deploy-manifest.json` e
          # `artifacts/railway/release` — prefixo comum `artifacts/` — entao o zip publica
          # `ci/`, `cd/` e `railway/` na RAIZ.
          #
          # Sem `path:`, o download joga esses diretorios na raiz do workspace e
          # `scripts/cd/verify-provenance.mjs` procura `artifacts/ci/build-metadata.json`:
          # ENOENT, job HML morre ANTES de qualquer deploy (medido no run 39675544425).
          #
          # Baixar sob `artifacts` recria o prefixo esperado pelos scripts.
          path: artifacts

      - name: Verify HML provenance and digest
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          PROVENANCE_EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Focused immutable-release tests
        run: node --test scripts/cd/railway-immutable-release.test.mjs

      - name: Enforce migration safety policy on the release DELTA
        # Avalia APENAS as migrations pendentes (fora do `_journal.json`), nunca o historico.
        #
        # Antes: `assessMigrationsDirectory()` varria as 104 migrations do repositorio e
        # encontrava para sempre as mesmas quatro do PASSADO que usam ALTER COLUMN/DROP
        # CONSTRAINT (0010, 0071, 0078, 0088). Medido no run 39682188718: reprovou uma release
        # em que NENHUMA migration nova existia — o gate bloqueava TODA promocao.
        #
        # Agora: migration ja registrada no journal e HISTORIA, nao risco de release. O que pode
        # quebrar a proxima promocao e a migration que ainda vai rodar.
        #
        # FAIL-CLOSED preservado: se o journal nao puder ser lido, `assessPendingMigrations`
        # LANCA em vez de devolver "nada pendente".
        #
        # `CD_ALLOW_BREAKING_MIGRATIONS` continua existindo como escape MANUAL excepcional e
        # NUNCA e habilitado por padrao — o gate nao foi desligado, so foi escopado.
        # FIX `bad substitution`: o `-e` recebia o script entre ASPAS DUPLAS, entao o SHELL
        # expandia `${applied.length}` ANTES de o tsx ver o codigo — e `${...}` nao e sintaxe
        # valida do bash. Medido no run 39697131764:
        #   line 1: ${applied.length}: bad substitution
        # Agora o script vai entre ASPAS SIMPLES (o shell nao toca em nada) e a concatenacao
        # usa `+` em vez de template literal.
        run: >
          pnpm --filter @cisne/api exec tsx -e
          'import { assessPendingMigrations, assertSafeMigrationDeploy } from "./src/ops/cd/migration-policy.ts";
          const { pending, applied } = assessPendingMigrations();
          console.log("applied=" + applied.length + " pending=" + pending.length);
          assertSafeMigrationDeploy(pending, process.env.CD_ALLOW_BREAKING_MIGRATIONS === "I_UNDERSTAND");
          console.log(JSON.stringify(pending));'

      - id: hml
        name: Ensure isolated HML and Postgres without source app deploys
        run: node scripts/cd/railway-ensure-hml.mjs

      - name: Deploy exact API + Web release to HML
        env:
          RAILWAY_TARGET_ENVIRONMENT_ID: ${{ steps.hml.outputs.environment_id }}
        run: node scripts/cd/railway-production-deploy.mjs

      - id: hml-domains
        name: Resolve HML public domains
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
        run: |
          railway domain --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_API_SERVICE_ID" --json > /tmp/hml-api-domain.json
          railway domain --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_WEB_SERVICE_ID" --json > /tmp/hml-web-domain.json
          echo "api_url=$(node scripts/cd/extract-railway-domain.mjs /tmp/hml-api-domain.json)" >> "$GITHUB_OUTPUT"
          echo "web_url=$(node scripts/cd/extract-railway-domain.mjs /tmp/hml-web-domain.json)" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral HML smoke credential
        run: |
          HML_LOGIN="hml-cd-${GITHUB_RUN_ID}@cisne.invalid"
          HML_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$HML_PASSWORD"
          echo "HML_SMOKE_LOGIN=$HML_LOGIN" >> "$GITHUB_ENV"
          echo "HML_SMOKE_PASSWORD=$HML_PASSWORD" >> "$GITHUB_ENV"

      - name: Bootstrap synthetic HML operator
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
          HML_SYNTHETIC_SEED_CONFIRM: I_UNDERSTAND
          BOOTSTRAP_CONFIRM: I_UNDERSTAND
          BOOTSTRAP_ADMIN_LOGIN: ${{ env.HML_SMOKE_LOGIN }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ env.HML_SMOKE_PASSWORD }}
        run: |
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$RAILWAY_API_SERVICE_ID"             node scripts/hml/bootstrap-synthetic.mjs

      - name: HML readiness and authenticated smoke
        env:
          HML_PUBLIC_API_URL: ${{ steps.hml-domains.outputs.api_url }}
        run: |
          curl --fail --show-error --silent "$HML_PUBLIC_API_URL/api/v1/health/ready"
          pnpm --filter @cisne/api hml:smoke

      - name: Prove HML SHA and digest
        env:
          HML_ENV_ID: ${{ steps.hml.outputs.environment_id }}
          EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
          HML_PUBLIC_WEB_URL: ${{ steps.hml-domains.outputs.web_url }}
        run: |
          set -euo pipefail
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WEB_SERVICE_ID"; do
            railway variable list --json --project "$RAILWAY_PROJECT_ID" --environment "$HML_ENV_ID" --service "$service" |
              EXPECTED_SHA="$EXPECTED_SHA" EXPECTED_DIGEST="$EXPECTED_DIGEST" node --input-type=module -e '
                let s=""; for await (const c of process.stdin) s+=c;
                const v=JSON.parse(s); const get=(k)=>Array.isArray(v)?v.find((x)=>x.name===k)?.value:v[k];
                if(get("CISNE_RELEASE_SHA")!==process.env.EXPECTED_SHA) throw new Error("HML SHA mismatch");
                if(get("CISNE_RELEASE_DIGEST")!==process.env.EXPECTED_DIGEST) throw new Error("HML digest mismatch");
              '
          done
          curl --fail --show-error --silent "$HML_PUBLIC_WEB_URL/release-identity.json" |
            EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e '
              let s=""; for await (const c of process.stdin) s+=c;
              if(JSON.parse(s).sourceSha!==process.env.EXPECTED_SHA) throw new Error("HML Web SHA mismatch");
            '

  acceptance:
    name: Acceptance gate
    runs-on: ubuntu-latest
    needs: deploy-hml
    steps:
      - run: echo "HML immutable release passed migrations, readiness, smoke and provenance"

  deploy-production:
    name: Promote same immutable release to production
    runs-on: ubuntu-latest
    needs: [resolve-ci-artifact, acceptance]
    environment: production
    timeout-minutes: 40
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PRD_PROMOTION_APPROVED: I_UNDERSTAND
      PRD_PROMOTION_APPROVED_BY: ${{ github.actor }}
      PRD_PROMOTION_APPROVAL_SOURCE: github-environment
      PROD_PUBLIC_API_URL: https://cisneapi-production.up.railway.app
      PROD_PUBLIC_WEB_URL: https://cisneweb-production-db99.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies for smoke only
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install pinned Railway CLI
        run: npm install --global @railway/cli@5.23.3

      - name: Download same promotion bundle
        uses: actions/download-artifact@v4
        with:
          name: cisne-promotion-${{ github.run_id }}

      - name: Verify production provenance and digest
        env:
          PROVENANCE_EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          PROVENANCE_EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
          PROVENANCE_VERIFY_CHECKOUT: 'true'
        run: node scripts/cd/verify-provenance.mjs

      - name: Fail closed if production smoke credentials are unavailable
        env:
          PROD_SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$PROD_SMOKE_LOGIN"
          test -n "$PROD_SMOKE_PASSWORD"

      - name: Promote API + Web from exact same artifact
        env:
          RAILWAY_TARGET_ENVIRONMENT_ID: ${{ env.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          CISNE_DEPLOY_COMMIT_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          CISNE_DEPLOY_ARTIFACT_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
        run: node scripts/cd/railway-production-deploy.mjs

      - name: Production readiness
        run: curl --fail --show-error --silent "$PROD_PUBLIC_API_URL/api/v1/health/ready"

      - name: Production authenticated /me + capabilities smoke
        env:
          HML_PUBLIC_API_URL: ${{ env.PROD_PUBLIC_API_URL }}
          HML_SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          HML_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
        run: pnpm --filter @cisne/api hml:smoke

      - name: Prove production SHA and digest
        env:
          EXPECTED_SHA: ${{ needs.resolve-ci-artifact.outputs.source_sha }}
          EXPECTED_DIGEST: ${{ needs.resolve-ci-artifact.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          for service in "$RAILWAY_API_SERVICE_ID" "$RAILWAY_WEB_SERVICE_ID"; do
            railway variable list --json --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_PRODUCTION_ENVIRONMENT_ID" --service "$service" |
              EXPECTED_SHA="$EXPECTED_SHA" EXPECTED_DIGEST="$EXPECTED_DIGEST" node --input-type=module -e '
                let s=""; for await (const c of process.stdin) s+=c;
                const v=JSON.parse(s); const get=(k)=>Array.isArray(v)?v.find((x)=>x.name===k)?.value:v[k];
                if(get("CISNE_RELEASE_SHA")!==process.env.EXPECTED_SHA) throw new Error("production SHA mismatch");
                if(get("CISNE_RELEASE_DIGEST")!==process.env.EXPECTED_DIGEST) throw new Error("production digest mismatch");
              '
          done
          curl --fail --show-error --silent "$PROD_PUBLIC_WEB_URL/release-identity.json" |
            EXPECTED_SHA="$EXPECTED_SHA" node --input-type=module -e '
              let s=""; for await (const c of process.stdin) s+=c;
              if(JSON.parse(s).sourceSha!==process.env.EXPECTED_SHA) throw new Error("production Web SHA mismatch");
            '

      - name: Record production manifest
        run: cat artifacts/cd/deploy-manifest.json
