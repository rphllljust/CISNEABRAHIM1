name: Temporary dependency audit fix

on:
  push:
    branches:
      - fix/ci-audit-20261012

permissions:
  contents: write

jobs:
  fix-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-audit-20261012
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve patched dependency graph
        run: pnpm install --no-frozen-lockfile
      - name: Verify high-severity audit gate
        run: pnpm audit --audit-level=high
      - name: Commit dependency fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml apps/*/package.json packages/*/package.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 1
          fi
          git commit -m "fix(security): refresh vulnerable dependencies"
          git push origin HEAD:fix/ci-audit-20261012
