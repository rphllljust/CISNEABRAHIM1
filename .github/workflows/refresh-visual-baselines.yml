name: Refresh visual baselines

on:
  push:
    branches:
      - baseline/app-shell-visual-contract

permissions:
  contents: write

concurrency:
  group: refresh-visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: baseline/app-shell-visual-contract
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Chromium
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Regenerate visual baselines
        continue-on-error: true
        run: pnpm --filter @cisne/web exec playwright test --update-snapshots
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Commit regenerated baselines
        run: |
          git add 'apps/web/e2e/visual/**/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(web): regenerate visual baselines"
          git push origin HEAD:baseline/app-shell-visual-contract
