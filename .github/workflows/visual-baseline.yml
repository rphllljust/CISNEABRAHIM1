# Baseline visual somente por dispatch, no container oficial alinhado ao lockfile.
# Snapshots NUNCA sao aceitos automaticamente: os PNGs alterados vao para PR draft.
# Diferencas semanticas/funcionais permanecem falhas; a regeneracao nao e uma aprovacao.
name: Visual baseline (dispatch)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'SHA exato ou branch que define o codigo e as fixtures; revisar o HEAD no log'
        required: true
        type: string
      specs:
        description: 'all = todos os specs; ou lista de nomes separados por espaco (ex.: accounting.visual fiscal.visual)'
        required: true
        default: 'all'
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baseline
  cancel-in-progress: false

jobs:
  baseline:
    name: Gerar baseline Linux em PR draft
    runs-on: ubuntu-latest
    container:
      # Mesma versao do Visual Full e do pnpm-lock.yaml.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 60
    env:
      CI: 'true'
      VITE_CISNE_SURFACE: 'dev'
    steps:
      - name: Checkout do ref solicitado
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: true
      - name: Registrar SHA de origem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          git rev-parse HEAD | tee artifacts/ci/visual-baseline-source-sha.txt
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Verify Playwright runtime and fonts
        run: node scripts/ci/visual-runtime-verify.mjs
      - name: Regenerate snapshots in pinned Linux environment
        id: snapshot-update
        # Preserve original test outcome, yet allow a draft with PARTIAL baselines for review.
        continue-on-error: true
        shell: bash
        env:
          VISUAL_SPECS: ${{ inputs.specs }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$VISUAL_SPECS" != "all" ]]; then
            # Never turn arbitrary dispatch input into a shell command or Playwright flag.
            read -r -a requested <<< "$VISUAL_SPECS"
            test "${#requested[@]}" -gt 0
            for name in "${requested[@]}"; do
              [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::Invalid spec name: $name"; exit 1; }
              name="${name%.spec.ts}"
              path="e2e/visual/$name.spec.ts"
              [[ -f "apps/web/$path" ]] || { echo "::error::Unknown visual spec: $path"; exit 1; }
              args+=("$path")
            done
          fi
          # No grep-invert: the all mode really covers every visual test/project.
          # No || true: a functional assertion failure must prevent generating an approval PR.
          pnpm --filter @cisne/web exec playwright test "${args[@]}" --update-snapshots --retries=0 --workers=2
      - name: Upload diagnostics and comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-baseline-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            artifacts/ci/visual-baseline-source-sha.txt
            artifacts/ci/visual-runtime.json
            apps/web/test-results
            apps/web/playwright-report
      - name: Propose changed PNGs in a draft PR (never autoaccept)
        if: ${{ !cancelled() && (steps.snapshot-update.outcome == 'success' || steps.snapshot-update.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VISUAL_SPECS: ${{ inputs.specs }}
          UPDATE_OUTCOME: ${{ steps.snapshot-update.outcome }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # A failing Playwright execution is recorded as PARTIAL, not green. Never auto-merge.
          # Stage tracked AND newly created snapshots (git diff alone misses untracked PNGs).
          git add -- ':(glob)apps/web/e2e/visual/**/*.png'
          if git diff --cached --quiet; then
            echo "No visual baseline changes to propose."
            exit 0
          fi
          echo "Changed snapshot files:"
          git diff --cached --name-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/visual-baseline-${GITHUB_RUN_ID}"
          source_sha="$(git rev-parse HEAD)"
          git switch -c "$branch"
          git commit -m "test(visual): regenerate Linux baseline from ${source_sha}"
          git push origin "HEAD:refs/heads/$branch"
          export BASELINE_BRANCH="$branch" BASELINE_SOURCE_SHA="$source_sha"
          node --input-type=module <<'NODE'
          const { GITHUB_REPOSITORY: repo, GH_TOKEN: token, GITHUB_SERVER_URL: server, GITHUB_RUN_ID: runId, BASELINE_BRANCH: head, BASELINE_SOURCE_SHA: sha, VISUAL_SPECS: specs, UPDATE_OUTCOME: outcome } = process.env;
          const payload = {
            title: 'test(visual): Linux baseline (' + specs + ') — ' + (outcome === 'success' ? 'review required' : 'PARTIAL / FAILED tests'),
            head, base: 'main', draft: true,
            body: 'Generated in the pinned Playwright v1.62.1-noble container.\n' +
              'Source SHA: `' + sha + '`\n' +
              'Specs: `' + specs + '`\n' +
              'Generator Playwright outcome: **' + outcome.toUpperCase() + '** (failures need fixes; PNGs are not approved).\n' +
              'Workflow evidence: ' + server + '/' + repo + '/actions/runs/' + runId + '\n\n' +
              '**Review each changed PNG against expected UI and the diff artifacts before approval.** ' +
              'This PR is not an authorization for production or for automatic acceptance.',
          };
          const response = await fetch('https://api.github.com/repos/' + repo + '/pulls', {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + token,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });
          if (!response.ok) throw new Error('Failed to create baseline PR: HTTP ' + response.status + ': ' + (await response.text()).slice(0, 600));
          const pr = await response.json();
          console.log('Baseline draft PR: ' + pr.html_url);
          NODE
      - name: Enforce original snapshot-generation test result
        if: always()
        shell: bash
        env:
          UPDATE_OUTCOME: ${{ steps.snapshot-update.outcome }}
        run: |
          if [[ "$UPDATE_OUTCOME" != "success" ]]; then
            echo "::error::Playwright baseline generation did not pass ($UPDATE_OUTCOME). Any draft PNGs are PARTIAL and not accepted."
            exit 1
          fi
