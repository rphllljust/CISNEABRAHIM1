name: Visual full

# Suite visual independente para execucao agendada ou manual.
# O Visual Full de TODOS os PRs e pushes e executado, sem filtro de paths,
# no workflow CI e e exigido por Release ready no SHA exato.
# Este workflow adicional preserva a verificacao noturna e sob demanda.

on:
  schedule:
    # 04:17 UTC — fora de qualquer janela de release típica.
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  # Grupo proprio para verificacao noturna/manual; o gate bloqueante mora no CI.
  group: visual-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  FORCE_COLOR: '1'

jobs:
  visual-full:
    name: Visual full
    runs-on: ubuntu-latest
    # Runtime pinado: o MESMO container (Chromium 1.62.1 + fontes) para baseline e execucao.
    # Versao = `@playwright/test@1.62.1` em pnpm-lock.yaml. Sem isso o diff e artefato de ambiente.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Verify Visual Full exit-status contract
        run: node --test scripts/ci/visual-full-exit-status.test.mjs
      - name: Verify Playwright runtime and fonts
        run: node scripts/ci/visual-runtime-verify.mjs
      - name: Web visual regression (full suite)
        id: web-visual
        # `continue-on-error` NAO esconde regressao: a decisao de vermelho/verde fica no ratchet
        # abaixo, que reprova o job em regressao real. Sair cedo aqui impediria o upload dos
        # diagnosticos e a analise do ratchet — que e justamente o que precisa existir quando a
        # suite falha.
        continue-on-error: true
        shell: bash
        run: |
          # Keep Playwright's exit status authoritative instead of tee's status.
          # Otherwise a failing full suite is recorded as success by the ratchet.
          set -euo pipefail
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual 2>&1 | tee artifacts/ci/web-visual.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual.log
      - name: Visual regression debt ratchet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: node scripts/ci/visual-regression-ratchet.mjs artifacts/ci/web-visual.log
      - name: Enforce strict Visual Full acceptance
        if: always()
        shell: bash
        env:
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: |
          # A clean ratchet only proves no NEW regressions; it does not prove a passing suite.
          # This terminal gate intentionally fails while any existing visual debt persists.
          if [[ "${VISUAL_OUTCOME}" != "success" ]]; then
            echo "::error::Visual Full acceptance blocked: Playwright did not pass; existing debt is not a green suite."
            exit 1
          fi
