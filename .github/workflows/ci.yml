name: CI

on:
  push:
    branches:
      - master
      - main
      # Branch de trabalho autorizada. Sem este gatilho as correcoes ficam sem
      # validacao: o push em main so acontece no merge, e o PR esbarra no conflito
      # de docs/00-governance/prompt-execution-log.md, de modo que nenhuma execucao
      # jamais mediria o SHA que recebe as correcoes.
      - 'rc/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  # Disposable CI-only credentials — never reuse outside ephemeral runners.
  POSTGRES_USER: cisne_ci
  POSTGRES_PASSWORD: cisne_ci_disposable_password
  POSTGRES_DB: cisne_ci
  DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci
  TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_ISSUER: cisne-api
  JWT_AUDIENCE: cisne-clients
  CORS_ORIGIN: http://localhost:5173

jobs:
  static-quality:
    name: Lint / Typecheck / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency audit (high severity and above)
        run: pnpm audit:deps

      - name: SRC-002 business gate
        run: pnpm gate:src-002

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: static-quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  database-and-integration:
    name: Database gate / Integration / API E2E
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create disposable integration-test database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        # `psql -c` aceita SQL puro OU um unico meta-comando, nunca os dois: a forma
        # anterior mandava `\gexec` para o servidor e o job morria com
        # `ERROR: syntax error at or near "\"` antes de qualquer teste. Pelo stdin o
        # meta-comando e interpretado pelo psql e o CREATE continua idempotente.
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<'SQL'
          SELECT format('CREATE DATABASE %I OWNER %I', 'cisne_ci_test', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'cisne_ci_test')\gexec
          SQL

      - name: Database migration gate
        run: pnpm gate:database

      - name: Apply migrations to integration-test database
        run: pnpm db:migrate:test

      - name: Integration tests
        run: pnpm test:integration

      - name: API end-to-end tests
        run: pnpm test:e2e

  build:
    name: Build / artifacts
    runs-on: ubuntu-latest
    needs: database-and-integration
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium (web visual regression)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps

      - name: Web visual regression
        run: pnpm --filter @cisne/web test:visual
        env:
          CI: 'true'

      - name: Emit build metadata
        run: node scripts/ci-emit-build-metadata.mjs

      - name: Emit deploy manifest (artifact digest)
        run: node scripts/cd/emit-deploy-manifest.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisne-build-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            apps/api/dist
            apps/web/dist
            packages/database/dist
