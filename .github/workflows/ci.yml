name: CI

on:
  push:
    branches:
      - master
      - main
      - 'rc/**'
  pull_request:

# CONCORRENCIA DO CI — dois grupos nomeados, sem misturar CI com promocao.
#
# O QUE ESTAVA ERRADO
#
# A formula anterior era `ci-${{ github.workflow }}-${{ ...number || github.ref }}` com
# `cancel-in-progress` FALSO em `main`. Isso produzia duas falhas opostas:
#
#   1. Dois push em `main` caem no MESMO grupo (`ci-CI-refs/heads/main`). Como `main` nao
#      cancelava, o run novo ficava `pending` com ZERO jobs ate o anterior terminar inteiro.
#      Medido: run ee2e1658 esperou 20+ min para comecar por causa do run 93f229f1. Nao era
#      falta de runner — era fila artificial de concurrency.
#
#   2. O grupo nao distinguia PR de `main` de forma explicita: um PR de numero igual a nada
#      caia no fallback `github.ref`, e o comportamento de cancelamento dependia de uma
#      expressao composta em vez da politica declarada.
#
# POLITICA ATUAL (declarada, nao inferida)
#
#   PR     -> grupo `ci-pr-<numero>`; runs superseded do MESMO PR sao cancelados. Um push novo
#             no PR invalida o anterior: so o SHA mais recente interessa.
#   MAIN   -> grupo `ci-main`; runs superseded TAMBEM sao cancelados.
#   CD     -> grupo PROPRIO (`cd-production`, em cd.yml). NUNCA compartilha grupo com o CI.
#
# POR QUE CANCELAR `main` E SEGURO AQUI
#
# O CD nao roda dentro deste workflow: ele e disparado por `workflow_run` quando o CI conclui,
# e so consome runs cujo `release-ready` ficou verde. Cancelar um run de CI SUPERSEDED nao
# interrompe promocao alguma — a promocao ja autorizada vive no CD, em grupo separado, com
# `cancel-in-progress: false`. O comentario anterior dizia "main preserva a ativa"; preservar
# a run ativa era justamente o que criava a fila.
#
# O que NUNCA acontece: um CI novo cancelar uma release em HML ou producao. `workflow_run`
# nao propaga cancelamento, e o CD tem grupo proprio (ver cd.yml).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  POSTGRES_USER: cisne_ci
  POSTGRES_PASSWORD: cisne_ci_disposable_password
  POSTGRES_DB: cisne_ci
  DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci
  TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_ISSUER: cisne-api
  JWT_AUDIENCE: cisne-clients
  CORS_ORIGIN: http://localhost:5173

jobs:
  static-quality:
    name: Lint / Typecheck / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency audit (high severity and above)
        run: pnpm audit:deps
      - name: SRC-002 business gate
        run: pnpm gate:src-002
      - name: Immutable Railway release focused test
        run: node --test scripts/cd/railway-immutable-release.test.mjs

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-unit-${{ matrix.shard }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Unit tests shard
        run: pnpm exec turbo run test -- --shard=${{ matrix.shard }}

  # Stable check name: every matrix shard must pass before this check is green.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: unit-test-shards
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "$SHARDS_RESULT" = "success"

  database-migration-gate:
    name: Database migration gate
    runs-on: ubuntu-latest
    # GATE UMA VEZ SO, MAS CONTRA POSTGRES PROPRIO. Sem `needs`.
    #
    # `pnpm gate:database` NAO e um gate puramente estatico: ele abre conexao `pg.Client` real
    # (`scripts/ci-database-gate.mjs`) para aplicar a cadeia completa de migrations em um database
    # FRESCO e conferir os schemas resultantes. Ele so functiona onde existe um servidor Postgres.
    #
    # DEFEITO MEDIDO (run 39722020814): quando este gate foi separado para job proprio, o job
    # nasceu SEM servico `postgres` — herdou do job de integracao apenas a intencao, nao o servico.
    # O step falhou em 0.5s com `CI database gate: FAIL` / `Exit status 1`, sem sequer chegar a
    # executar migration alguma: nao havia banco para conectar.
    #
    # CORRECAO: serviço `postgres` identico ao que o job de origem tinha. O gate continua sendo UM
    # step, executado UMA vez — nao vira gate por shard.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Database migration gate
        run: pnpm gate:database

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # INTEGRATION EXECUTOR — UM host quente, N workers locais, N bancos efemeros
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  #
  # O QUE ESTE JOB SUBSTITUI
  #
  # Antes: 8 jobs `Integration (1/8..8/8)` em runners FRIOS do GitHub. Cada um pagava
  #   13s container + 2s checkout + 3s pnpm + 5s node + 3s install + 3s migrate + 19s build
  # = 44s de overhead, 8x = 352s desperdicados, contra 146s de teste real.
  #
  # Medido no run 39785822308 (o run que foi para a main):
  #   shard mais lento 196s | mais rapido 127s | overhead repetido 352s | total ~28 runner-min
  #
  # Agora o overhead e pago UMA vez neste job, e o paralelismo acontece ENTRE processos locais,
  # nao entre maquinas frias.
  #
  # ISOLAMENTO — A GARANTIA QUE NAO MUDA
  #
  # Cada worker recebe `TEST_DATABASE_URL` de um database FISICAMENTE distinto
  # (`cisne_it_01`..`cisne_it_08`), clonado de um template ja migrado. Advisory locks no Postgres
  # sao escopados POR DATABASE: dois workers em bancos diferentes pegam locks diferentes mesmo com
  # a MESMA chave `0x43534e45`. Por isso `maxWorkers: 1` pode permanecer DENTRO de cada worker
  # sem nenhuma contencao ENTRE workers.
  #
  # MIGRATIONS UMA VEZ
  #
  # `cisne_integration_template` recebe a cadeia completa uma vez (~3s). Os 8 bancos sao clones
  # `CREATE DATABASE ... TEMPLATE` (~120ms cada). Antes: 8 x 3s. Agora: 1 x 3s + 8 x 120ms.
  #
  # FAIL-CLOSED (inegociavel — ver scripts/ci/integration-executor.mjs)
  #
  #   worker falhou / morreu        -> exit 1
  #   spec sem shard                -> exit 1
  #   spec duplicado                -> exit 1
  #   scheduler quebrou             -> exit 1
  #   cobertura incompleta          -> exit 1
  #   banco nao clonou              -> exit 1
  #   cleanup falhou                -> exit 1
  #
  # Nenhum `continue-on-error`, nenhum `|| true`, nenhum retry, nenhum timeout inflado.
  integration-executor:
    name: Integration
    # SELF-HOSTED QUENTE. Enquanto o runner OVH nao existir, o fallback abaixo mantem o CI
    # funcionando (ver comentario seguinte) — mas o estado final e o runner dedicado.
    runs-on: ${{ vars.CI_INTEGRATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # POSTGRESQL — UMA VEZ
      # ─────────────────────────────────────────────────────────────────────────────────────────
      #
      # No runner self-hosted o servico ja esta residente e NAO deve ser iniciado como container
      # efemero (o `services:` do Actions nao existe fora do runner gerenciado). O executor se
      # conecta via `INTEGRATION_ADMIN_URL`.
      #
      # Em `ubuntu-latest` (fallback) sobe-se o servico normalmente.
      - name: Start PostgreSQL (hosted runner fallback)
        if: vars.CI_INTEGRATION_RUNNER == ''
        run: |
          docker run -d --name cisne-ci-pg \
            -e POSTGRES_USER=cisne_ci \
            -e POSTGRES_PASSWORD=cisne_ci_disposable_password \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            --health-cmd "pg_isready -U cisne_ci -d postgres" \
            --health-interval 5s --health-timeout 5s --health-retries 12 \
            postgres:18-alpine
          for i in $(seq 1 30); do
            if docker exec cisne-ci-pg pg_isready -U cisne_ci -d postgres >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::postgres did not become ready"; exit 1
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # BUILD — UMA VEZ (FASE 3)
      # ─────────────────────────────────────────────────────────────────────────────────────────
      #
      # Antes: `pnpm --filter @cisne/api... build` rodava DENTRO de cada um dos 8 shards (19s x 8).
      # `...` inclui as dependencias de workspace — o serializer importa `@cisne/database`, que
      # resolve para `dist/`. Sem build o Vitest falha na COLETA ("Failed to resolve entry for
      # package @cisne/database"), nao no teste.
      #
      # Agora roda uma vez, aqui.
      - name: Build workspace packages
        run: pnpm --filter @cisne/api... build
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # EXECUTOR: template -> clones -> 8 workers -> agregacao -> cleanup
      # ─────────────────────────────────────────────────────────────────────────────────────────
      - name: Run integration executor
        env:
          INTEGRATION_WORKERS: '8'
          INTEGRATION_ADMIN_URL: postgresql://cisne_ci:cisne_ci_disposable_password@127.0.0.1:5432/postgres
          INTEGRATION_TEMPLATE_DB: cisne_integration_template
          INTEGRATION_DB_PREFIX: cisne_it_
          INTEGRATION_SCHEMA_PREPARED: '1'
          INTEGRATION_SHARD_DEBUG: '1'
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          JWT_ISSUER: cisne-api
          JWT_AUDIENCE: cisne-clients
          CORS_ORIGIN: http://localhost:5173
        run: node scripts/ci/integration-executor.mjs
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # INSTRUMENTACAO — historico por spec para o scheduler LPT do proximo run
      # ─────────────────────────────────────────────────────────────────────────────────────────
      - name: Collect integration timings
        if: always()
        run: node scripts/ci/integration-timings.mjs collect || true
      - name: Publish CI metrics
        if: always()
        run: node scripts/ci/integration-timings.mjs summary
      - name: Upload CI telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-telemetry-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ci/integration-timings.json
            artifacts/ci/ci-metrics.json
            artifacts/ci/integration.*.timings.ndjson
      - name: Stop PostgreSQL (hosted runner fallback)
        if: always() && vars.CI_INTEGRATION_RUNNER == ''
        run: docker rm -f cisne-ci-pg || true

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    # PAR DO `database-and-integration`, com BANCO PROPRIO. Nenhum dos dois espera o outro.
    #
    # Mesmo servico Postgres por conveniencia de imagem, mas DATABASE distinto: o advisory lock
    # de `cisne_ci_integration` nao existe em `cisne_ci_e2e`, porque locks sao por database.
    #
    # MIGRATIONS PROPIAS: `ensure-migrations` (globalSetup do vitest.e2e) aplica no banco deste
    # job. Ele nao herda schema de ninguem — se aplicar errado, falha aqui, isolado.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_NAME: cisne_ci_e2e
      TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create disposable e2e database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<SQL
          SELECT format('CREATE DATABASE %I OWNER %I', '${E2E_DATABASE_NAME}', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${E2E_DATABASE_NAME}')\gexec
          SQL
      - name: API end-to-end tests
        run: pnpm test:e2e

  build-release:
    name: Build / artifacts
    runs-on: ubuntu-latest
    # SEM `needs`. O pacote imutavel (artefato + manifest + digest) NAO depende do resultado de
    # integracao ou de unidade — ele empacota o MESMO commit, e a promocao so acontece se
    # `release-ready` confirmar que todos os gates passaram.
    #
    # Antes: `needs: database-and-integration` colocava o build atras do gate de ~21 min. O
    # artefato ficava refem do job mais lento, e qualquer falha visual (que rodava DENTRO deste
    # job) impedia o artefato de existir — foi o que travou uma correcao de backend por 13m19s
    # sem que nada de errado houvesse no codigo.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Emit build metadata
        run: node scripts/ci-emit-build-metadata.mjs
      - name: Package immutable Railway release
        run: node scripts/cd/railway-immutable-release.mjs
      - name: Emit deploy manifest (artifact digest)
        run: node scripts/cd/emit-deploy-manifest.mjs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisne-build-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            artifacts/railway/release

  detect-change-scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    # CLASSIFICADOR DE RISCO VISUAL — decide se `visual-full` e obrigatorio.
    #
    # O problema que isto resolve: a suite visual completa leva ~16 min. Rodar SEMPRE bloqueando
    # qualquer release significa que um fix de SQL no backend espera 16 minutos por snapshots de
    # Contabilidade que nao tem como ter mudado. Rodar NUNCA bloqueando significa perder a
    # regressao visual que importa.
    #
    # A saida `visual_risk` responde uma pergunta objetiva: "este commit tocou superficie
    # visual?" — avaliada pelo CAMINHO dos arquivos alterados, nao por julgamento.
    #
    # FALHA ABERTA (fail-open para o lado seguro): se nao for possivel determinar o diff
    # (workflow_dispatch sem base, push inicial), `visual_risk = true`. Classificar errado como
    # "sem risco" pularia a suite completa justamente quando nao se sabe o que mudou. Classificar
    # errado como "com risco" apenas custa tempo.
    outputs:
      visual_risk: ${{ steps.scope.outputs.visual_risk }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          determine_range() {
            if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
              echo "${PR_BASE_SHA}...${HEAD_SHA}"
              return
            fi
            if [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ]; then
              case "$PUSH_BEFORE" in
                0000000000000000000000000000000000000000) : ;;
                *)
                  if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                    echo "${PUSH_BEFORE}...${HEAD_SHA}"
                    return
                  fi
                  ;;
              esac
            fi
            # Sem base confiavel: fail-open (trata como risco visual).
            echo "__UNKNOWN__"
          }

          range="$(determine_range)"
          if [ "$range" = "__UNKNOWN__" ]; then
            echo "Nao foi possivel determinar o diff (evento=$EVENT_NAME). Tratando como risco visual."
            echo "visual_risk=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$range" || true)"
          count="$(printf '%s' "$files" | grep -c . || true)"
          echo "Arquivos alterados: $count"
          printf '%s\n' "$files" | head -50

          # Superficie visual = tudo que pode mudar pixel renderizado.
          visual='^(apps/web/src/|apps/web/e2e/visual/|apps/web/index\.html|apps/web/vite\.config\.ts|apps/web/tailwind\.config|packages/ui/|packages/design-|.*\.css$)'

          if printf '%s\n' "$files" | grep -Eq "$visual"; then
            echo "visual_risk=true" >> "$GITHUB_OUTPUT"
            echo "Superficie visual tocada -> visual-full OBRIGATORIO."
          else
            echo "visual_risk=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma superficie visual tocada -> visual-full roda em modo informativo."
          fi
          echo "changed_files=$count" >> "$GITHUB_OUTPUT"

  visual-critical:
    name: Visual critical
    runs-on: ubuntu-latest
    # GATE OBRIGATORIO E CURTO — entra no `release-ready`.
    #
    # PROBLEMA MEDIDO: a suite visual completa (24 specs x 3 viewports = ate 72 comparacoes)
    # levou 15m47s e virou o caminho critico depois que o build caiu para ~56s. Um ajuste de
    # densidade numa tela de Contabilidade bloqueava a promocao de uma correcao de backend por
    # 16 minutos.
    #
    # O QUE ESTE JOB COBRE (definido por RISCO OPERACIONAL, nao por "metade da suite"):
    #
    #   login     — porta de entrada. Se quebrar, ninguem entra no produto.
    #   dashboard — Central de Operacoes, primeira dobra. Se quebrar, o operador nao ve o
    #               trabalho que precisa fazer.
    #
    # Sao as duas superficies cujo defeito visual IMPEDE operacao. As demais (fiscal,
    # contabilidade, compras, proposta, inventario) quebram MODULOS — grave, mas nao impedem o
    # produto de abrir, e continuam cobertas pelo `visual-full`.
    #
    # VIEWPORT: apenas `desktop`. O critical responde "a tela ainda existe na estrutura
    # esperada?". Responsividade em 390px e pergunta legitima do `visual-full`.
    #
    # CREDIBILIDADE: `maxDiffPixelRatio: 0.01`, o MESMO da suite completa. Um critical mais
    # permissivo seria teatro.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Chromium (visual critical)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Visual critical suite
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual:critical 2>&1 | tee artifacts/ci/web-visual-critical.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual critical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-critical-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual-critical.log

  visual-full:
    name: Visual full
    runs-on: ubuntu-latest
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # RETIRADO DO CAMINHO CRITICO DO CD — SEM REDUZIR UM PIXEL DE COBERTURA
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # MEDIDO: a suite completa (24 specs x 3 viewports = ate 72 comparacoes) levou 10m31s no run
    # 39719203623 (passo `Web visual regression (full suite)`, 03:53:14Z -> 04:03:36Z). Ela NAO
    # estava no `needs` do `release-ready`, mas rodava DENTRO do workflow `CI` em todo `push` —
    # e o CD dispara em `workflow_run: [CI] types: [completed]`. Consequencia: o evento que
    # autoriza a promocao so chegava depois que o visual completo terminasse. Um fix de backend
    # esperava ~10 min por snapshots de telas que nao tinham como ter mudado.
    #
    # AGORA: a suite completa vive em `visual-full.yml`, com gatilhos proprios (nightly,
    # manual, e obrigatoria em PR cujo diff toca superficie visual). Este workflow `CI` deixa de
    # emitir `Visual full` e, portanto, deixa de atrasar o `completed` que libera o CD.
    #
    # O QUE NAO MUDA
    #
    #   - NENHUM snapshot removido; NENHUM limiar afrouxado (`maxDiffPixelRatio` intacto);
    #   - `Visual critical` PERMANECE no `release-ready` (ver `release-ready.needs` abaixo);
    #   - a regressao visual continua bloqueando release: `visual-critical` no caminho critico,
    #     `visual-full` bloqueante em PR com risco visual e no nightly.
    #
    # Este job e mantido APENAS para `pull_request` com risco visual, onde bloquear e correto e o
    # `completed` do CI nao autoriza promocao alguma (PR nao promove). Em `push` para `main` —
    # o evento que dispara o CD — o visual completo NAO roda aqui: ele roda no `visual-full.yml`.
    needs: detect-change-scope
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-change-scope.outputs.visual_risk == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium (web visual regression)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Web visual regression (full suite)
        id: web-visual
        continue-on-error: true
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual 2>&1 | tee artifacts/ci/web-visual.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual.log
      - name: Visual regression debt ratchet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: node scripts/ci/visual-regression-ratchet.mjs artifacts/ci/web-visual.log

  release-ready:
    name: Release ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AGREGADOR OBRIGATORIO — o UNICO contrato que o CD consome.
    #
    # O CD dispara em `workflow_run: [CI] types: [completed]` e aceita qualquer conclusao
    # `success`. Sem um agregador, "a CI passou" pode significar "os jobs que rodaram passaram",
    # e um job ausente nunca reprova. Este job transforma a topologia inteira em UM veredito:
    # se qualquer gate required falhou, foi cancelado ou simplesmente nao rodou, aqui e `failure`.
    #
    # `if: always()` e deliberado: o job TEM de rodar mesmo quando um gate falha — e exatamente
    # nesse caso que ele precisa reprovar. Um `release-ready` que nao roda quando algo falha
    # seria um falso verde.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # FAIL-CLOSED — POR QUE `skipped` E `cancelled` REPROVAM
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # O teste e `$result != "success"`, e NAO `$result == "failure"`. A diferenca e o ponto
    # inteiro: um job `skipped` (condicao `if` nao satisfeita), `cancelled` (concurrency matou o
    # run) ou com nome divergente devolve algo DIFERENTE de `success` — e todos reprovam.
    #
    # Um agregador escrito como `!= "failure"` transformaria job ausente em liberacao de release.
    # Este e escrito para que a UNICA entrada que produz verde seja `success` explicito.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # GATES AGREGADOS — SO O QUE PROMOVE
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    #   unit-tests           : nome ESTAVEL que agrega o matrix de shards unitarios. Uma matrix
    #                          gera um check por shard; agregar pelo nome estavel impede que um
    #                          shard ausente passe despercebido.
    #   integration-executor : job UNICO (nao matrix). Agregar seria uma camada sem funcao.
    #                                    Uma matrix gera checks por shard; agregar pelo nome
    #                                    estavel impede que um shard ausente passe despercebido.
    #   database-migration-gate        : journal/cobertura de migrations (gate barato, uma vez).
    #   visual-critical                : UNICO visual no caminho de release (login + dashboard).
    #
    # FORA DO `needs`, E POR QUE ISSO NAO ENFRAQUECE NADA
    #
    #   detect-change-scope : classificador de risco, nao gate. Seu resultado entra em
    #                         `visual-full`, nao na decisao de promocao.
    #   visual-full         : permanece bloqueante em PR com risco visual. Em `push` para `main`
    #                         ele sai deste workflow (que e o que dispara o CD) e passa a viver em
    #                         `visual-full.yml` (nightly + manual) — sem perder cobertura: os
    #                         mesmos specs, os mesmos viewports, os mesmos limiares. A divisao e
    #                         por RISCO DE PROMOCAO, nao por conveniencia: `visual-critical` cobre
    #                         as telas cujo defeito IMPEDE operar; as demais continuam cobertas,
    #                         apenas em cadencia propria.
    needs:
      - static-quality
      - unit-tests
      - database-migration-gate
      - integration-executor
      - api-e2e
      - build-release
      - visual-critical
    if: always()
    steps:
      - name: Require every required gate to pass
        env:
          STATIC: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          MIGRATIONS: ${{ needs.database-migration-gate.result }}
          INTEGRATION: ${{ needs.integration-executor.result }}
          E2E: ${{ needs.api-e2e.result }}
          BUILD: ${{ needs.build-release.result }}
          VISUAL_CRITICAL: ${{ needs.visual-critical.result }}
        run: |
          echo "static-quality            : $STATIC"
          echo "unit-tests                : $UNIT"
          echo "database-migration-gate   : $MIGRATIONS"
          echo "integration-executor      : $INTEGRATION"
          echo "api-e2e                   : $E2E"
          echo "build-release             : $BUILD"
          echo "visual-critical           : $VISUAL_CRITICAL"
          failed=0
          for pair in \
            "static-quality:$STATIC" \
            "unit-tests:$UNIT" \
            "database-migration-gate:$MIGRATIONS" \
            "integration-executor:$INTEGRATION" \
            "api-e2e:$E2E" \
            "build-release:$BUILD" \
            "visual-critical:$VISUAL_CRITICAL"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            # FAIL-CLOSED: apenas `success` produz verde. `skipped`, `cancelled`, vazio e
            # `failure` reprovam todos.
            if [ "$result" != "success" ]; then
              echo "::error::required gate '$name' concluded '$result' — release is NOT ready"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "release-ready: every required gate succeeded"
