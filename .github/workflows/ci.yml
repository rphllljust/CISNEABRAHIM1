name: CI

on:
  push:
    branches:
      - master
      - main
      - 'rc/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # PRs e branches de trabalho cancelam execuções antigas; main preserva a ativa.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  POSTGRES_USER: cisne_ci
  POSTGRES_PASSWORD: cisne_ci_disposable_password
  POSTGRES_DB: cisne_ci
  DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci
  TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_ISSUER: cisne-api
  JWT_AUDIENCE: cisne-clients
  CORS_ORIGIN: http://localhost:5173

jobs:
  static-quality:
    name: Lint / Typecheck / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency audit (high severity and above)
        run: pnpm audit:deps
      - name: SRC-002 business gate
        run: pnpm gate:src-002

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-unit-${{ matrix.shard }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Unit tests shard
        run: pnpm exec turbo run test -- --shard=${{ matrix.shard }}

  # Stable check name: every matrix shard must pass before this check is green.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: unit-test-shards
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "$SHARDS_RESULT" = "success"

  database-and-integration:
    name: Database gate / Integration / API E2E
    runs-on: ubuntu-latest
    needs: [static-quality, unit-tests]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create disposable integration-test database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<'SQL'
          SELECT format('CREATE DATABASE %I OWNER %I', 'cisne_ci_test', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'cisne_ci_test')\gexec
          SQL
      - name: Database migration gate
        run: pnpm gate:database
      - name: Apply migrations to integration-test database
        run: pnpm db:migrate:test
      - name: Integration tests
        run: pnpm test:integration
      - name: API end-to-end tests
        run: pnpm test:e2e

  build:
    name: Build / artifacts
    runs-on: ubuntu-latest
    needs: database-and-integration
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium (web visual regression)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Web visual regression
        id: web-visual
        continue-on-error: true
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual 2>&1 | tee artifacts/ci/web-visual.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 1
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual.log
      - name: Visual regression debt ratchet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: node scripts/ci/visual-regression-ratchet.mjs artifacts/ci/web-visual.log
      - name: Emit build metadata
        run: node scripts/ci-emit-build-metadata.mjs
      - name: Emit deploy manifest (artifact digest)
        run: node scripts/cd/emit-deploy-manifest.mjs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisne-build-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            apps/api/dist
            apps/web/dist
            packages/database/dist
            packages/database/migrations
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            apps/api/package.json
            apps/web/package.json
            packages/database/package.json
            packages/eslint-config/package.json
            packages/tsconfig/package.json
            docker/release/Dockerfile.api
            docker/release/Dockerfile.web
            docker/railway/nginx.conf
