name: CI

on:
  push:
    branches:
      - master
      - main
      - 'rc/**'
  pull_request:

# CONCORRENCIA DO CI — dois grupos nomeados, sem misturar CI com promocao.
#
# O QUE ESTAVA ERRADO
#
# A formula anterior era `ci-${{ github.workflow }}-${{ ...number || github.ref }}` com
# `cancel-in-progress` FALSO em `main`. Isso produzia duas falhas opostas:
#
#   1. Dois push em `main` caem no MESMO grupo (`ci-CI-refs/heads/main`). Como `main` nao
#      cancelava, o run novo ficava `pending` com ZERO jobs ate o anterior terminar inteiro.
#      Medido: run ee2e1658 esperou 20+ min para comecar por causa do run 93f229f1. Nao era
#      falta de runner — era fila artificial de concurrency.
#
#   2. O grupo nao distinguia PR de `main` de forma explicita: um PR de numero igual a nada
#      caia no fallback `github.ref`, e o comportamento de cancelamento dependia de uma
#      expressao composta em vez da politica declarada.
#
# POLITICA ATUAL (declarada, nao inferida)
#
#   PR     -> grupo `ci-pr-<numero>`; runs superseded do MESMO PR sao cancelados. Um push novo
#             no PR invalida o anterior: so o SHA mais recente interessa.
#   MAIN   -> grupo `ci-main`; runs superseded TAMBEM sao cancelados.
#   RELEASE -> grupo proprio em `coolify-release.yml`. NUNCA compartilha grupo com o CI.
#
# POR QUE CANCELAR `main` E SEGURO AQUI
#
# O CD nao roda dentro deste workflow: ele e disparado por `workflow_run` quando o CI conclui,
# e so consome runs cujo `release-ready` ficou verde. Cancelar um run de CI SUPERSEDED nao
# interrompe promocao alguma — a promocao ja autorizada vive no CD, em grupo separado, com
# `cancel-in-progress: false`. O comentario anterior dizia "main preserva a ativa"; preservar
# a run ativa era justamente o que criava a fila.
#
# O que NUNCA acontece: um CI novo cancelar uma release em HML ou producao. `workflow_run`
# nao propaga cancelamento, e o release Coolify tem grupo proprio em `coolify-release.yml`.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  POSTGRES_USER: cisne_ci
  POSTGRES_PASSWORD: cisne_ci_disposable_password
  POSTGRES_DB: cisne_ci
  DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci
  TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_ISSUER: cisne-api
  JWT_AUDIENCE: cisne-clients
  CORS_ORIGIN: http://localhost:5173

jobs:
  static-quality:
    name: Lint / Typecheck / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: GitHub Actions runtime audit
        run: node scripts/ci/github-actions-runtime-audit.mjs
      - name: Toolchain version audit
        run: node scripts/ci/toolchain-version-audit.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency audit (high severity and above)
        run: pnpm audit:deps
      - name: SRC-002 business gate
        run: pnpm gate:src-002
      - name: CD / release / provenance contract tests
        run: node --test scripts/cd/*.test.mjs scripts/ops/coolify-tls-audit.test.mjs scripts/ops/coolify-tls-harden.test.mjs
      # Impede que o artefato de producao volte a ser compilado com modulos CONSTRUIDOS
      # desligados. Falhou aqui = o operador receberia produto mutilado sem gate vermelho.
      # Roda no runner oficial do web (vitest), que resolve os imports de release-scope.
      - name: Production artifact flags gate
        run: pnpm --filter @cisne/web exec vitest run src/release-scope/production-artifact-flags.test.ts

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turbo task cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-unit-${{ matrix.shard }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Unit tests shard
        run: pnpm exec turbo run test -- --shard=${{ matrix.shard }}

  # Stable check name: every matrix shard must pass before this check is green.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: unit-test-shards
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "$SHARDS_RESULT" = "success"

  database-migration-gate:
    name: Database migration gate
    runs-on: ubuntu-latest
    # GATE UMA VEZ SO, MAS CONTRA POSTGRES PROPRIO. Sem `needs`.
    #
    # `pnpm gate:database` NAO e um gate puramente estatico: ele abre conexao `pg.Client` real
    # (`scripts/ci-database-gate.mjs`) para aplicar a cadeia completa de migrations em um database
    # FRESCO e conferir os schemas resultantes. Ele so functiona onde existe um servidor Postgres.
    #
    # DEFEITO MEDIDO (run 39722020814): quando este gate foi separado para job proprio, o job
    # nasceu SEM servico `postgres` — herdou do job de integracao apenas a intencao, nao o servico.
    # O step falhou em 0.5s com `CI database gate: FAIL` / `Exit status 1`, sem sequer chegar a
    # executar migration alguma: nao havia banco para conectar.
    #
    # CORRECAO: serviço `postgres` identico ao que o job de origem tinha. O gate continua sendo UM
    # step, executado UMA vez — nao vira gate por shard.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Database migration gate
        run: pnpm gate:database

  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  # INTEGRATION EXECUTOR — UM host quente, N workers locais, N bancos efemeros
  # ═══════════════════════════════════════════════════════════════════════════════════════════════
  #
  # O QUE ESTE JOB SUBSTITUI
  #
  # Antes: 8 jobs `Integration (1/8..8/8)` em runners FRIOS do GitHub. Cada um pagava
  #   13s container + 2s checkout + 3s pnpm + 5s node + 3s install + 3s migrate + 19s build
  # = 44s de overhead, 8x = 352s desperdicados, contra 146s de teste real.
  #
  # Medido no run 39785822308 (o run que foi para a main):
  #   shard mais lento 196s | mais rapido 127s | overhead repetido 352s | total ~28 runner-min
  #
  # Agora o overhead e pago UMA vez neste job, e o paralelismo acontece ENTRE processos locais,
  # nao entre maquinas frias.
  #
  # ISOLAMENTO — A GARANTIA QUE NAO MUDA
  #
  # Cada worker recebe `TEST_DATABASE_URL` de um database FISICAMENTE distinto
  # (`cisne_it_01`..`cisne_it_08`), clonado de um template ja migrado. Advisory locks no Postgres
  # sao escopados POR DATABASE: dois workers em bancos diferentes pegam locks diferentes mesmo com
  # a MESMA chave `0x43534e45`. Por isso `maxWorkers: 1` pode permanecer DENTRO de cada worker
  # sem nenhuma contencao ENTRE workers.
  #
  # MIGRATIONS UMA VEZ
  #
  # `cisne_integration_template` recebe a cadeia completa uma vez (~3s). Os 8 bancos sao clones
  # `CREATE DATABASE ... TEMPLATE` (~120ms cada). Antes: 8 x 3s. Agora: 1 x 3s + 8 x 120ms.
  #
  # FAIL-CLOSED (inegociavel — ver scripts/ci/integration-executor.mjs)
  #
  #   worker falhou / morreu        -> exit 1
  #   spec sem shard                -> exit 1
  #   spec duplicado                -> exit 1
  #   scheduler quebrou             -> exit 1
  #   cobertura incompleta          -> exit 1
  #   banco nao clonou              -> exit 1
  #   cleanup falhou                -> exit 1
  #
  # Nenhum `continue-on-error`, nenhum `|| true`, nenhum retry, nenhum timeout inflado.
  integration-suite:
    name: Integration suite
    needs: detect-change-scope
    if: needs.detect-change-scope.outputs.integration_required == 'true'
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # EXECUTION PLANE = GITHUB-HOSTED (decisao explicita, nao fallback)
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # O CI NAO roda no VPS de producao. Decisao arquitetural:
    #
    #   GitHub  -> CI / control plane / release authority
    #   OVH-1   -> PRODUCAO: Coolify, CISNE API, CISNE Web, runtime, proxy, banco de runtime
    #
    # Um runner de CI no VPS-1 compartilharia CPU, RAM, disco e socket do Docker com a aplicacao
    # em producao. Com 2 vCPU e 3,8 GB, 3 workers Vitest + PostgreSQL competiriam com php-fpm,
    # Horizon e Reverb pelo mesmo hardware. Isolamento nao e preferencia estetica: e o que impede
    # que um teste pesado degrade a aplicacao que o cliente esta usando.
    #
    # `ubuntu-latest` aqui nao e "fallback ate o OVH existir" — e o execution plane atual e
    # definitivo. Nao existe `CI_INTEGRATION_RUNNER` nem selecao por labels.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # POSTGRESQL — SERVICO DO JOB, UMA VEZ
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # `services:` e o mecanismo deterministico do Actions: o container sobe antes dos steps e e
    # destruido com o job. Nada de `docker run` manual, nada de start/stop condicional, nada de
    # PostgreSQL residente em runner compartilhado.
    #
    # Este servidor NAO tem relacao com o banco de producao. Credenciais sao descartaveis por
    # design; o database de runtime do CISNE vive em outro host, gerido pelo Coolify.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # `node_modules` NAO e cacheado: e mutavel, dependente de plataforma e a causa classica de
      # CI "verde localmente, quebrado no runner". `--frozen-lockfile` + cache do pnpm e
      # deterministico.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # HISTORICO DO SCHEDULER — PRECISA SOBREVIVER AO RUN
      # ─────────────────────────────────────────────────────────────────────────────────────────
      #
      # `ubuntu-latest` e efemero: o workspace nasce limpo a cada run. Publicar
      # `integration-timings.json` como artifact NAO faz o proximo run enxergar o arquivo — artifact
      # e registro, nao entrada. Sem restaurar antes, o LPT cairia no SEED em todo run e a frase
      # "historico real -> mediana -> LPT" seria falsa entre execucoes.
      #
      # `actions/cache` resolve com semantica nativa:
      #
      #   key         inclui `github.run_id` -> cada run grava uma entrada NOVA (cache imutavel)
      #   restore-keys prefixo estavel -> run N+1 restaura a entrada mais recente compativel
      #
      # O `run_id` no fim da chave e o que torna isso correto: o cache do Actions nao sobrescreve
      # chave existente, entao uma chave fixa seria escrita uma vez e nunca atualizada.
      #
      # ESCOPO MINIMO: SO o arquivo de pesos. Nao cacheamos `node_modules`, workspace, databases,
      # `ci-metrics.json` nem `.ndjson` de run antigo — sao telemetria de UM run e nao devem
      # reaparecer no seguinte.
      - name: Restore integration timing history
        uses: actions/cache@v6
        with:
          path: artifacts/ci/integration-timings.json
          key: integration-timings-v1-${{ github.run_id }}
          restore-keys: |
            integration-timings-v1-
      # BUILD — UMA VEZ
      # ─────────────────────────────────────────────────────────────────────────────────────────
      #
      # `...` inclui as dependencias de workspace: o serializer importa `@cisne/database`, que
      # resolve para `dist/`. Sem build o Vitest falha na COLETA ("Failed to resolve entry for
      # package @cisne/database"), nao no teste — foi exatamente o defeito do run 39782887902.
      - name: Build workspace packages
        run: pnpm --filter @cisne/api... build
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # EXECUTOR: template -> N clones -> N workers -> agregacao -> cleanup
      # ─────────────────────────────────────────────────────────────────────────────────────────
      - name: Run integration executor
        env:
          # POLITICA DE CONCORRENCIA — EXPLICITA, NAO DERIVADA DO HOST
          #
          # Default 3 (medido e validado no run 39794404313: 114/114 specs, 3 workers,
          # desequilibrio de 3,1%, zero swap).
          #
          # 4 WORKERS FOI TESTADO E REPROVADO (run 39882592182, PR #78). Nao retente sem
          # mudar a premissa. Resultado medido, com limite pre-registrado ANTES do teste:
          #   T3 (3 workers): 644 / 593 / 513 s  -> mediana 593 s
          #   T4 (4 workers): 608 s
          #   limite para vencer: 0,90 x 593 = 533,7 s  -> REPROVADO (608 > 533,7)
          # Nao so nao ganhou: ficou 15 s MAIS LENTO que a mediana de 3 workers.
          #
          # A causa esta medida, nao suposta — o custo do Integration e CPU-bound, sobra zero
          # ociosidade de CPU em `ubuntu-latest` (4 vCPU) para um 4o processo consumir.
          # Medicoes em banco clonado do schema real (312 tabelas), nao em estimativa:
          #   - round-trip Postgres local                   = 0,31 ms
          #   - beforeEach inteiro (8 trunc + 26 deletes)   = 59,1 ms = 3,0% dos ~2000 ms por it()
          #   - os 26 DELETEs de truncateServiceOrderTables = 8,5 ms
          #   - TRUNCATE listado (alternativa testada)      = 144,8 ms — 17x MAIS LENTO
          # Ou seja: nem I/O de banco nem limpeza explicam o tempo, logo paralelizar mais nao
          # ajuda. O ganho tem de vir do CORPO dos specs, nao da topologia de execucao.
          #
          # NAO derive de `os.availableParallelism()`: isso confunde METRICA com POLITICA e faz
          # o comportamento mudar conforme o host escolhido pelo scheduler.
          CI_INTEGRATION_WORKERS: ${{ vars.CI_INTEGRATION_WORKERS || '3' }}
          INTEGRATION_ADMIN_URL: postgresql://cisne_ci:cisne_ci_disposable_password@127.0.0.1:5432/postgres
          INTEGRATION_TEMPLATE_DB: cisne_integration_template
          INTEGRATION_DB_PREFIX: cisne_it_
          INTEGRATION_SCHEMA_PREPARED: '1'
          INTEGRATION_SHARD_DEBUG: '1'
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          JWT_ISSUER: cisne-api
          JWT_AUDIENCE: cisne-clients
          CORS_ORIGIN: http://localhost:5173
        run: node apps/api/scripts/integration-executor.mjs
      # ─────────────────────────────────────────────────────────────────────────────────────────
      # INSTRUMENTACAO — historico por spec para o scheduler LPT do proximo run
      # ─────────────────────────────────────────────────────────────────────────────────────────
      #
      # TELEMETRIA NAO DERRUBA O CI, MAS TAMBEM NAO FALHA EM SILENCIO.
      #
      # Antes: `node ... collect || true`. O `|| true` engolia qualquer erro — inclusive um
      # schema quebrado que faria a telemetria parar de funcionar para sempre, sem ninguem notar
      # ate o scheduler perder todo o historico.
      #
      # Agora a coleta roda num step proprio com tratamento explicito: falha vira `::warning::`
      # identificavel, o diagnostico e publicado como artifact, e o exit code NAO propaga. Assim
      # um defeito de instrumentacao e VISIVEL sem transformar um CI verde em vermelho por causa
      # de um problema secundario.
      - name: Collect integration timings
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if out=$(node scripts/ci/integration-timings.mjs collect 2>&1); then
            printf '%s\n' "$out"
          else
            status=$?
            printf '%s\n' "$out"
            echo "::warning title=CI telemetry::integration-timings collect failed (exit $status). The test result is unaffected, but the LPT scheduler will fall back to conservative weights on the next run."
            mkdir -p artifacts/ci
            {
              echo "collect_exit=$status"
              echo "at=$(date -u +%FT%TZ)"
              echo '--- output ---'
              printf '%s\n' "$out"
            } > artifacts/ci/telemetry-failure.log
            # Diagnostico publicado; falha NAO propaga para o veredito do job.
            exit 0
          fi
      - name: Publish CI metrics
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          if out=$(node scripts/ci/integration-timings.mjs summary 2>&1); then
            printf '%s\n' "$out"
          else
            status=$?
            printf '%s\n' "$out"
            echo "::warning title=CI telemetry::integration-timings summary failed (exit $status)."
            mkdir -p artifacts/ci
            { echo "summary_exit=$status"; printf '%s\n' "$out"; } >> artifacts/ci/telemetry-failure.log
            exit 0
          fi
      - name: Upload CI telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-telemetry-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ci/integration-timings.json
            artifacts/ci/ci-metrics.json
            artifacts/ci/integration.*.timings.ndjson
            artifacts/ci/telemetry-failure.log
      # Nao ha step de parada do PostgreSQL: `services:` e destruido pelo proprio Actions quando o
      # job termina, inclusive em falha ou cancelamento. Um teardown manual aqui seria redundante
      # e, pior, daria a impressao de que o ciclo de vida do banco esta sob nosso controle.

  integration-executor:
    name: Integration
    needs:
      - detect-change-scope
      - integration-suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove Integration execution or justified N/A
        env:
          CLASSIFIER: ${{ needs.detect-change-scope.result }}
          REQUIRED: ${{ needs.detect-change-scope.outputs.integration_required }}
          REASON: ${{ needs.detect-change-scope.outputs.integration_reason }}
          CHANGED_PATHS: ${{ needs.detect-change-scope.outputs.changed_paths }}
          CLASSIFIER_SHA: ${{ needs.detect-change-scope.outputs.classifier_sha }}
          SUITE: ${{ needs.integration-suite.result }}
        run: |
          set -euo pipefail
          echo "change-scope=$CLASSIFIER"
          echo "integration_required=$REQUIRED"
          echo "integration_suite=$SUITE"
          echo "reason=$REASON"
          echo "changed_paths=$CHANGED_PATHS"
          echo "classifier_sha=$CLASSIFIER_SHA"

          if [ "$CLASSIFIER" != "success" ]; then
            echo "::error::change-scope classifier concluded '$CLASSIFIER'"
            exit 1
          fi
          if [ -z "$REASON" ] || [ -z "$CHANGED_PATHS" ] || [ -z "$CLASSIFIER_SHA" ]; then
            echo "::error::impact evidence incomplete — refusing silent PASS"
            exit 1
          fi

          case "$REQUIRED" in
            true)
              echo "mode=REAL_SUITE"
              if [ "$SUITE" != "success" ]; then
                echo "::error::Integration required but suite concluded '$SUITE'"
                exit 1
              fi
              echo "Integration gate: REAL_SUITE passed."
              ;;
            false)
              echo "mode=NOT_APPLICABLE"
              if [ "$REASON" != "CD_ONLY_CHANGE" ]; then
                echo "::error::Integration N/A without CD_ONLY_CHANGE reason ('$REASON')"
                exit 1
              fi
              if [ "$SUITE" != "skipped" ]; then
                echo "::error::Integration N/A expected suite=skipped, got '$SUITE'"
                exit 1
              fi
              echo "Integration gate: NOT_APPLICABLE reason=CD_ONLY_CHANGE."
              ;;
            *)
              echo "::error::Integration requirement is unknown ('$REQUIRED') — fail closed."
              exit 1
              ;;
          esac

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    # PAR DO `database-and-integration`, com BANCO PROPRIO. Nenhum dos dois espera o outro.
    #
    # Mesmo servico Postgres por conveniencia de imagem, mas DATABASE distinto: o advisory lock
    # de `cisne_ci_integration` nao existe em `cisne_ci_e2e`, porque locks sao por database.
    #
    # MIGRATIONS PROPIAS: `ensure-migrations` (globalSetup do vitest.e2e) aplica no banco deste
    # job. Ele nao herda schema de ninguem — se aplicar errado, falha aqui, isolado.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_NAME: cisne_ci_e2e
      TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create disposable e2e database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<SQL
          SELECT format('CREATE DATABASE %I OWNER %I', '${E2E_DATABASE_NAME}', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${E2E_DATABASE_NAME}')\gexec
          SQL
      - name: API end-to-end tests
        run: pnpm test:e2e

  build-release:
    name: Build / artifacts
    runs-on: ubuntu-latest
    # SEM `needs`. O pacote imutavel (artefato + manifest + digest) NAO depende do resultado de
    # integracao ou de unidade — ele empacota o MESMO commit, e a promocao so acontece se
    # `release-ready` confirmar que todos os gates passaram.
    #
    # Antes: `needs: database-and-integration` colocava o build atras do gate de ~21 min. O
    # artefato ficava refem do job mais lento, e qualquer falha visual (que rodava DENTRO deste
    # job) impedia o artefato de existir — foi o que travou uma correcao de backend por 13m19s
    # sem que nada de errado houvesse no codigo.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        # DECISAO DE RELEASE EXPLICITA — este job produz o artefato imutavel que vai para
        # producao, portanto e ELE que precisa declarar a superficie de modulos.
        #
        # DEFEITO QUE ESTA CORRECAO FECHA (medido em 2026-10-23):
        #
        # `apps/web/src/release-scope/feature-flags.ts` resolve o default por
        # `VITE_CISNE_SURFACE`. HML declara `hml` (docker/hml/compose.yaml) e o job de
        # visual declara `dev` (linhas ~676/763). Este job NAO declarava nada, entao caia
        # em `conservative-default` e compilava o bundle com os 13 modulos CONSTRUIDOS
        # desligados. Prova: resolveModuleFlag com env vazio devolvia
        # `enabled=false origin=conservative-default` para finance, fiscal, accounting,
        # inventory, payroll, procurement, suppliers, contracts, people, alerts, reports,
        # approval-matrix e operational-profitability.
        #
        # Sintoma ao operador: backend respondendo, menu sem os modulos, produto mutilado —
        # e nenhum gate vermelho, porque nada falhava.
        #
        # `production` NAO esta em HOMOLOGATION_SURFACES, entao promove-lo sozinho nao faz
        # nada: a liberacao e declarada modulo a modulo abaixo, de forma explicita, em vez
        # de herdada por omissao. Modulos STUB (rentals, transport) seguem desligados por
        # nao terem backend real atras.
        env:
          VITE_CISNE_SURFACE: 'production'
          VITE_FEATURE_MODULE_FINANCE: 'true'
          VITE_FEATURE_MODULE_FISCAL: 'true'
          VITE_FEATURE_MODULE_ACCOUNTING: 'true'
          VITE_FEATURE_MODULE_INVENTORY: 'true'
          VITE_FEATURE_MODULE_PAYROLL: 'true'
          VITE_FEATURE_MODULE_PROCUREMENT: 'true'
          VITE_FEATURE_MODULE_SUPPLIERS: 'true'
          VITE_FEATURE_MODULE_CONTRACTS: 'true'
          VITE_FEATURE_MODULE_PEOPLE: 'true'
          VITE_FEATURE_MODULE_ALERTS: 'true'
          VITE_FEATURE_MODULE_REPORTS: 'true'
          VITE_FEATURE_MODULE_APPROVAL_MATRIX: 'true'
          VITE_FEATURE_MODULE_OPERATIONAL_PROFITABILITY: 'true'
        run: pnpm build
      - name: Emit build metadata
        run: node scripts/ci-emit-build-metadata.mjs
      - name: Package immutable release
        run: node scripts/cd/immutable-release.mjs
      - name: Emit deploy manifest (artifact digest)
        run: node scripts/cd/emit-deploy-manifest.mjs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cisne-build-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            artifacts/release

  detect-change-scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    # CLASSIFICADOR DE RISCO VISUAL — decide se `visual-full` e obrigatorio.
    #
    # O problema que isto resolve: a suite visual completa leva ~16 min. Rodar SEMPRE bloqueando
    # qualquer release significa que um fix de SQL no backend espera 16 minutos por snapshots de
    # Contabilidade que nao tem como ter mudado. Rodar NUNCA bloqueando significa perder a
    # regressao visual que importa.
    #
    # A saida `visual_risk` responde uma pergunta objetiva: "este commit tocou superficie
    # visual?" — avaliada pelo CAMINHO dos arquivos alterados, nao por julgamento.
    #
    # FALHA ABERTA (fail-open para o lado seguro): se nao for possivel determinar o diff
    # (workflow_dispatch sem base, push inicial), `visual_risk = true`. Classificar errado como
    # "sem risco" pularia a suite completa justamente quando nao se sabe o que mudou. Classificar
    # errado como "com risco" apenas custa tempo.
    outputs:
      visual_risk: ${{ steps.scope.outputs.visual_risk }}
      integration_required: ${{ steps.scope.outputs.integration_required }}
      integration_reason: ${{ steps.scope.outputs.integration_reason }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
      changed_paths: ${{ steps.scope.outputs.changed_paths }}
      classifier_sha: ${{ steps.classifier_sha.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test change-scope classifier
        run: node --test scripts/ci/change-scope.test.mjs
      - id: classifier_sha
        name: Fingerprint change-scope classifier
        run: echo "sha=$(git rev-parse HEAD:scripts/ci/change-scope.mjs)" >> "$GITHUB_OUTPUT"
      - id: scope
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          determine_range() {
            if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
              echo "${PR_BASE_SHA}...${HEAD_SHA}"
              return
            fi
            if [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ]; then
              case "$PUSH_BEFORE" in
                0000000000000000000000000000000000000000) : ;;
                *)
                  if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                    echo "${PUSH_BEFORE}...${HEAD_SHA}"
                    return
                  fi
                  ;;
              esac
            fi
            # Sem base confiavel: fail-open (trata como risco visual).
            echo "__UNKNOWN__"
          }

          range="$(determine_range)"
          if [ "$range" = "__UNKNOWN__" ]; then
            echo "Nao foi possivel determinar o diff (evento=$EVENT_NAME). Fail-closed: visual e Integration obrigatorios."
            node scripts/ci/change-scope.mjs --unknown >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$range" || true)"
          count="$(printf '%s' "$files" | grep -c . || true)"
          echo "Arquivos alterados: $count"
          printf '%s\n' "$files" | head -50

          scope_outputs="$(printf '%s\n' "$files" | node scripts/ci/change-scope.mjs)"
          printf '%s\n' "$scope_outputs" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$scope_outputs"

          if printf '%s\n' "$scope_outputs" | grep -q '^integration_required=false
          echo "changed_files=$count" >> "$GITHUB_OUTPUT"

  visual-critical:
    name: Visual critical
    runs-on: ubuntu-latest
    # GATE OBRIGATORIO E CURTO — entra no `release-ready`.
    #
    # PROBLEMA MEDIDO: a suite visual completa (24 specs x 3 viewports = ate 72 comparacoes)
    # levou 15m47s e virou o caminho critico depois que o build caiu para ~56s. Um ajuste de
    # densidade numa tela de Contabilidade bloqueava a promocao de uma correcao de backend por
    # 16 minutos.
    #
    # O QUE ESTE JOB COBRE (definido por RISCO OPERACIONAL, nao por "metade da suite"):
    #
    #   login     — porta de entrada. Se quebrar, ninguem entra no produto.
    #   dashboard — Central de Operacoes, primeira dobra. Se quebrar, o operador nao ve o
    #               trabalho que precisa fazer.
    #
    # Sao as duas superficies cujo defeito visual IMPEDE operacao. As demais (fiscal,
    # contabilidade, compras, proposta, inventario) quebram MODULOS — grave, mas nao impedem o
    # produto de abrir, e continuam cobertas pelo `visual-full`.
    #
    # VIEWPORT: apenas `desktop`. O critical responde "a tela ainda existe na estrutura
    # esperada?". Responsividade em 390px e pergunta legitima do `visual-full`.
    #
    # CREDIBILIDADE: `maxDiffPixelRatio: 0.01`, o MESMO da suite completa. Um critical mais
    # permissivo seria teatro.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      # MEDIDO: `playwright install chromium --with-deps` levou 622s e era 91% do job
      # (a suite em si leva 40s). O custo e quase todo download do browser + apt de
      # dependencias do sistema. O cache abaixo guarda APENAS o browser, com chave pela
      # versao pinada do Playwright -- nao ha estado de teste nem snapshot cacheado.
      # Cache miss cai no install normal (fail-open para o caminho lento, nunca para um
      # falso verde).
      #
      # GANHO MEDIDO com este cache (runs 39859726524 e 39860828242):
      #   Install Playwright Chromium  622s -> 22-30s
      #   Visual critical (job)        684s -> 70-93s
      #   suite em si                   40s -> 27-42s (cobertura intacta)
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (visual critical)
        # Com o browser em cache, `--with-deps` (apt) ainda custaria centenas de segundos
        # por reinstalar bibliotecas do sistema. Ele so roda no cache miss; no hit, o
        # browser ja esta completo em ~/.cache/ms-playwright.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "browser em cache — pulando download/apt"
            pnpm --filter @cisne/web exec playwright install chromium
          else
            pnpm --filter @cisne/web exec playwright install chromium --with-deps
          fi
      - name: Visual critical suite
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual:critical 2>&1 | tee artifacts/ci/web-visual-critical.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual critical diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-critical-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual-critical.log

  visual-full:
    name: Visual full
    runs-on: ubuntu-latest
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # RETIRADO DO CAMINHO CRITICO DO CD — SEM REDUZIR UM PIXEL DE COBERTURA
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # MEDIDO: a suite completa (24 specs x 3 viewports = ate 72 comparacoes) levou 10m31s no run
    # 39719203623 (passo `Web visual regression (full suite)`, 03:53:14Z -> 04:03:36Z). Ela NAO
    # estava no `needs` do `release-ready`, mas rodava DENTRO do workflow `CI` em todo `push` —
    # e o CD dispara em `workflow_run: [CI] types: [completed]`. Consequencia: o evento que
    # autoriza a promocao so chegava depois que o visual completo terminasse. Um fix de backend
    # esperava ~10 min por snapshots de telas que nao tinham como ter mudado.
    #
    # AGORA: a suite completa vive em `visual-full.yml`, com gatilhos proprios (nightly,
    # manual, e obrigatoria em PR cujo diff toca superficie visual). Este workflow `CI` deixa de
    # emitir `Visual full` e, portanto, deixa de atrasar o `completed` que libera o CD.
    #
    # O QUE NAO MUDA
    #
    #   - NENHUM snapshot removido; NENHUM limiar afrouxado (`maxDiffPixelRatio` intacto);
    #   - `Visual critical` PERMANECE no `release-ready` (ver `release-ready.needs` abaixo);
    #   - a regressao visual continua bloqueando release: `visual-critical` no caminho critico,
    #     `visual-full` bloqueante em PR com risco visual e no nightly.
    #
    # Este job e mantido APENAS para `pull_request` com risco visual, onde bloquear e correto e o
    # `completed` do CI nao autoriza promocao alguma (PR nao promove). Em `push` para `main` —
    # o evento que dispara o CD — o visual completo NAO roda aqui: ele roda no `visual-full.yml`.
    needs: detect-change-scope
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.detect-change-scope.outputs.visual_risk == 'true'
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      # Mesmo cache de browser do `visual-critical`: o custo dominante e download +
      # apt, nao a suite. Chave pela versao do lockfile; miss cai no install completo.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (web visual regression)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            echo "browser em cache — pulando download/apt"
            pnpm --filter @cisne/web exec playwright install chromium
          else
            pnpm --filter @cisne/web exec playwright install chromium --with-deps
          fi
      - name: Web visual regression (full suite)
        id: web-visual
        continue-on-error: true
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual 2>&1 | tee artifacts/ci/web-visual.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-visual-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual.log
      - name: Visual regression debt ratchet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: node scripts/ci/visual-regression-ratchet.mjs artifacts/ci/web-visual.log

  release-ready:
    name: Release ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AGREGADOR OBRIGATORIO — o UNICO contrato que o CD consome.
    #
    # O CD dispara em `workflow_run: [CI] types: [completed]` e aceita qualquer conclusao
    # `success`. Sem um agregador, "a CI passou" pode significar "os jobs que rodaram passaram",
    # e um job ausente nunca reprova. Este job transforma a topologia inteira em UM veredito:
    # se qualquer gate required falhou, foi cancelado ou simplesmente nao rodou, aqui e `failure`.
    #
    # `if: always()` e deliberado: o job TEM de rodar mesmo quando um gate falha — e exatamente
    # nesse caso que ele precisa reprovar. Um `release-ready` que nao roda quando algo falha
    # seria um falso verde.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # FAIL-CLOSED — POR QUE `skipped` E `cancelled` REPROVAM
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # O teste e `$result != "success"`, e NAO `$result == "failure"`. A diferenca e o ponto
    # inteiro: um job `skipped` (condicao `if` nao satisfeita), `cancelled` (concurrency matou o
    # run) ou com nome divergente devolve algo DIFERENTE de `success` — e todos reprovam.
    #
    # Um agregador escrito como `!= "failure"` transformaria job ausente em liberacao de release.
    # Este e escrito para que a UNICA entrada que produz verde seja `success` explicito.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # GATES AGREGADOS — SO O QUE PROMOVE
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    #   unit-tests           : nome ESTAVEL que agrega o matrix de shards unitarios. Uma matrix
    #                          gera um check por shard; agregar pelo nome estavel impede que um
    #                          shard ausente passe despercebido.
    #   integration-executor : gate ESTAVEL. Exige suite verde quando o impacto requer Integration
    #                          ou prova N/A fail-closed quando o delta e exclusivamente scripts/cd/**.
    #                                    Uma matrix gera checks por shard; agregar pelo nome
    #                                    estavel impede que um shard ausente passe despercebido.
    #   database-migration-gate        : journal/cobertura de migrations (gate barato, uma vez).
    #   visual-critical                : UNICO visual no caminho de release (login + dashboard).
    #
    # FORA DO `needs`, E POR QUE ISSO NAO ENFRAQUECE NADA
    #
    #   detect-change-scope : classificador de risco, nao gate. Seu resultado entra em
    #                         `visual-full`, nao na decisao de promocao.
    #   visual-full         : permanece bloqueante em PR com risco visual. Em `push` para `main`
    #                         ele sai deste workflow (que e o que dispara o CD) e passa a viver em
    #                         `visual-full.yml` (nightly + manual) — sem perder cobertura: os
    #                         mesmos specs, os mesmos viewports, os mesmos limiares. A divisao e
    #                         por RISCO DE PROMOCAO, nao por conveniencia: `visual-critical` cobre
    #                         as telas cujo defeito IMPEDE operar; as demais continuam cobertas,
    #                         apenas em cadencia propria.
    needs:
      - static-quality
      - unit-tests
      - database-migration-gate
      - integration-executor
      - api-e2e
      - build-release
      - visual-critical
    if: always()
    steps:
      - name: Require every required gate to pass
        env:
          STATIC: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          MIGRATIONS: ${{ needs.database-migration-gate.result }}
          INTEGRATION: ${{ needs.integration-executor.result }}
          E2E: ${{ needs.api-e2e.result }}
          BUILD: ${{ needs.build-release.result }}
          VISUAL_CRITICAL: ${{ needs.visual-critical.result }}
        run: |
          echo "static-quality            : $STATIC"
          echo "unit-tests                : $UNIT"
          echo "database-migration-gate   : $MIGRATIONS"
          echo "integration-executor      : $INTEGRATION"
          echo "api-e2e                   : $E2E"
          echo "build-release             : $BUILD"
          echo "visual-critical           : $VISUAL_CRITICAL"
          failed=0
          for pair in \
            "static-quality:$STATIC" \
            "unit-tests:$UNIT" \
            "database-migration-gate:$MIGRATIONS" \
            "integration-executor:$INTEGRATION" \
            "api-e2e:$E2E" \
            "build-release:$BUILD" \
            "visual-critical:$VISUAL_CRITICAL"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            # FAIL-CLOSED: apenas `success` produz verde. `skipped`, `cancelled`, vazio e
            # `failure` reprovam todos.
            if [ "$result" != "success" ]; then
              echo "::error::required gate '$name' concluded '$result' — release is NOT ready"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "release-ready: every required gate succeeded"
; then
            echo "Integration N/A com prova de impacto: delta restrito a scripts/cd/**."
          else
            echo "Integration obrigatorio: delta toca caminho fora da allow-list N/A."
          fi
          echo "changed_files=$count" >> "$GITHUB_OUTPUT"

