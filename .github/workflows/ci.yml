name: CI

on:
  push:
    branches:
      - master
      - main
      - 'rc/**'
  pull_request:

# CONCORRENCIA DO CI — dois grupos nomeados, sem misturar CI com promocao.
#
# O QUE ESTAVA ERRADO
#
# A formula anterior era `ci-${{ github.workflow }}-${{ ...number || github.ref }}` com
# `cancel-in-progress` FALSO em `main`. Isso produzia duas falhas opostas:
#
#   1. Dois push em `main` caem no MESMO grupo (`ci-CI-refs/heads/main`). Como `main` nao
#      cancelava, o run novo ficava `pending` com ZERO jobs ate o anterior terminar inteiro.
#      Medido: run ee2e1658 esperou 20+ min para comecar por causa do run 93f229f1. Nao era
#      falta de runner — era fila artificial de concurrency.
#
#   2. O grupo nao distinguia PR de `main` de forma explicita: um PR de numero igual a nada
#      caia no fallback `github.ref`, e o comportamento de cancelamento dependia de uma
#      expressao composta em vez da politica declarada.
#
# POLITICA ATUAL (declarada, nao inferida)
#
#   PR     -> grupo `ci-pr-<numero>`; runs superseded do MESMO PR sao cancelados. Um push novo
#             no PR invalida o anterior: so o SHA mais recente interessa.
#   MAIN   -> grupo `ci-main`; runs superseded TAMBEM sao cancelados.
#   CD     -> grupo PROPRIO (`cd-production`, em cd.yml). NUNCA compartilha grupo com o CI.
#
# POR QUE CANCELAR `main` E SEGURO AQUI
#
# O CD nao roda dentro deste workflow: ele e disparado por `workflow_run` quando o CI conclui,
# e so consome runs cujo `release-ready` ficou verde. Cancelar um run de CI SUPERSEDED nao
# interrompe promocao alguma — a promocao ja autorizada vive no CD, em grupo separado, com
# `cancel-in-progress: false`. O comentario anterior dizia "main preserva a ativa"; preservar
# a run ativa era justamente o que criava a fila.
#
# O que NUNCA acontece: um CI novo cancelar uma release em HML ou producao. `workflow_run`
# nao propaga cancelamento, e o CD tem grupo proprio (ver cd.yml).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: '1'
  POSTGRES_USER: cisne_ci
  POSTGRES_PASSWORD: cisne_ci_disposable_password
  POSTGRES_DB: cisne_ci
  DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci
  TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_test
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
  JWT_ISSUER: cisne-api
  JWT_AUDIENCE: cisne-clients
  CORS_ORIGIN: http://localhost:5173

jobs:
  static-quality:
    name: Lint / Typecheck / Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Dependency audit (high severity and above)
        run: pnpm audit:deps
      - name: SRC-002 business gate
        run: pnpm gate:src-002
      - name: Immutable Railway release focused test
        run: node --test scripts/cd/railway-immutable-release.test.mjs

  unit-test-shards:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore Turbo task cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-unit-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-unit-${{ matrix.shard }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Unit tests shard
        run: pnpm exec turbo run test -- --shard=${{ matrix.shard }}

  # Stable check name: every matrix shard must pass before this check is green.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: unit-test-shards
    if: always()
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.unit-test-shards.result }}
        run: test "$SHARDS_RESULT" = "success"

  database-and-integration:
    name: Database gate / Integration
    runs-on: ubuntu-latest
    # SEM `needs`. Nao consome artefato nem resultado de outro job: checkout, dependencias e
    # PostgreSQL proprios. A dependencia anterior era artificial e custava o tempo do job mais
    # lento a todos os outros.
    #
    # ─────────────────────────────────────────────────────────────────────────────────────────
    # SEPARADO DE `api-e2e` (CI/CD-06)
    # ─────────────────────────────────────────────────────────────────────────────────────────
    #
    # GARGALO MEDIDO: este job levou 21m26s no run 39665977954, porque rodava
    # `Integration tests` E `API end-to-end tests` SEQUENCIALMENTE contra o MESMO banco
    # (`cisne_ci_test`), ambos disputando o mesmo advisory lock global
    # (`INTEGRATION_TEST_DB_LOCK_KEY = 0x43534e45`).
    #
    # Separar em dois jobs usando o MESMO banco seria paralelismo cosmetico: o lock faria o
    # segundo esperar o primeiro de qualquer forma — a serializacao apenas sairia do workflow e
    # iria para o Postgres.
    #
    # AGORA cada job tem BANCO PROPRIO:
    #   este job    -> cisne_ci_integration
    #   api-e2e     -> cisne_ci_e2e
    #
    # POR QUE ISSO RESOLVE O LOCK SEM MEXER NO LOCK
    #
    # Advisory locks do Postgres sao escopados POR DATABASE, nao pelo cluster. Duas conexoes em
    # databases diferentes pegam locks diferentes mesmo com a MESMA chave `0x43534e45`. Ou seja:
    # a exclusividade do banco torna o lock global inofensivo por construcao — nenhuma linha de
    # `integration-test-db-lock.ts` precisa mudar, e o lock continua protegendo o que deve
    # proteger (acesso concorrente ao MESMO banco dentro do proprio job).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # BANCO EXCLUSIVO DESTE JOB. `TEST_DATABASE_URL` aponta para ELE e para mais nenhum.
      INTEGRATION_DATABASE_NAME: cisne_ci_integration
      TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_integration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create disposable integration database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<SQL
          SELECT format('CREATE DATABASE %I OWNER %I', '${INTEGRATION_DATABASE_NAME}', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${INTEGRATION_DATABASE_NAME}')\gexec
          SQL
      - name: Database migration gate
        run: pnpm gate:database
      - name: Apply migrations to integration database
        run: pnpm db:migrate:test
      - name: Integration tests
        run: pnpm test:integration

  api-e2e:
    name: API E2E
    runs-on: ubuntu-latest
    # PAR DO `database-and-integration`, com BANCO PROPRIO. Nenhum dos dois espera o outro.
    #
    # Mesmo servico Postgres por conveniencia de imagem, mas DATABASE distinto: o advisory lock
    # de `cisne_ci_integration` nao existe em `cisne_ci_e2e`, porque locks sao por database.
    #
    # MIGRATIONS PROPIAS: `ensure-migrations` (globalSetup do vitest.e2e) aplica no banco deste
    # job. Ele nao herda schema de ninguem — se aplicar errado, falha aqui, isolado.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cisne_ci
          POSTGRES_PASSWORD: cisne_ci_disposable_password
          POSTGRES_DB: cisne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cisne_ci -d cisne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      E2E_DATABASE_NAME: cisne_ci_e2e
      TEST_DATABASE_URL: postgresql://cisne_ci:cisne_ci_disposable_password@localhost:5432/cisne_ci_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Create disposable e2e database
        env:
          PGPASSWORD: cisne_ci_disposable_password
        run: |
          psql -h localhost -U cisne_ci -d cisne_ci -v ON_ERROR_STOP=1 <<SQL
          SELECT format('CREATE DATABASE %I OWNER %I', '${E2E_DATABASE_NAME}', 'cisne_ci')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${E2E_DATABASE_NAME}')\gexec
          SQL
      - name: API end-to-end tests
        run: pnpm test:e2e

  build-release:
    name: Build / artifacts
    runs-on: ubuntu-latest
    # SEM `needs`. O pacote imutavel (artefato + manifest + digest) NAO depende do resultado de
    # integracao ou de unidade — ele empacota o MESMO commit, e a promocao so acontece se
    # `release-ready` confirmar que todos os gates passaram.
    #
    # Antes: `needs: database-and-integration` colocava o build atras do gate de ~21 min. O
    # artefato ficava refem do job mais lento, e qualquer falha visual (que rodava DENTRO deste
    # job) impedia o artefato de existir — foi o que travou uma correcao de backend por 13m19s
    # sem que nada de errado houvesse no codigo.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Emit build metadata
        run: node scripts/ci-emit-build-metadata.mjs
      - name: Package immutable Railway release
        run: node scripts/cd/railway-immutable-release.mjs
      - name: Emit deploy manifest (artifact digest)
        run: node scripts/cd/emit-deploy-manifest.mjs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cisne-build-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci/build-metadata.json
            artifacts/cd/deploy-manifest.json
            artifacts/railway/release

  detect-change-scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    # CLASSIFICADOR DE RISCO VISUAL — decide se `visual-full` e obrigatorio.
    #
    # O problema que isto resolve: a suite visual completa leva ~16 min. Rodar SEMPRE bloqueando
    # qualquer release significa que um fix de SQL no backend espera 16 minutos por snapshots de
    # Contabilidade que nao tem como ter mudado. Rodar NUNCA bloqueando significa perder a
    # regressao visual que importa.
    #
    # A saida `visual_risk` responde uma pergunta objetiva: "este commit tocou superficie
    # visual?" — avaliada pelo CAMINHO dos arquivos alterados, nao por julgamento.
    #
    # FALHA ABERTA (fail-open para o lado seguro): se nao for possivel determinar o diff
    # (workflow_dispatch sem base, push inicial), `visual_risk = true`. Classificar errado como
    # "sem risco" pularia a suite completa justamente quando nao se sabe o que mudou. Classificar
    # errado como "com risco" apenas custa tempo.
    outputs:
      visual_risk: ${{ steps.scope.outputs.visual_risk }}
      changed_files: ${{ steps.scope.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          determine_range() {
            if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
              echo "${PR_BASE_SHA}...${HEAD_SHA}"
              return
            fi
            if [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ]; then
              case "$PUSH_BEFORE" in
                0000000000000000000000000000000000000000) : ;;
                *)
                  if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                    echo "${PUSH_BEFORE}...${HEAD_SHA}"
                    return
                  fi
                  ;;
              esac
            fi
            # Sem base confiavel: fail-open (trata como risco visual).
            echo "__UNKNOWN__"
          }

          range="$(determine_range)"
          if [ "$range" = "__UNKNOWN__" ]; then
            echo "Nao foi possivel determinar o diff (evento=$EVENT_NAME). Tratando como risco visual."
            echo "visual_risk=true" >> "$GITHUB_OUTPUT"
            echo "changed_files=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$range" || true)"
          count="$(printf '%s' "$files" | grep -c . || true)"
          echo "Arquivos alterados: $count"
          printf '%s\n' "$files" | head -50

          # Superficie visual = tudo que pode mudar pixel renderizado.
          visual='^(apps/web/src/|apps/web/e2e/visual/|apps/web/index\.html|apps/web/vite\.config\.ts|apps/web/tailwind\.config|packages/ui/|packages/design-|.*\.css$)'

          if printf '%s\n' "$files" | grep -Eq "$visual"; then
            echo "visual_risk=true" >> "$GITHUB_OUTPUT"
            echo "Superficie visual tocada -> visual-full OBRIGATORIO."
          else
            echo "visual_risk=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma superficie visual tocada -> visual-full roda em modo informativo."
          fi
          echo "changed_files=$count" >> "$GITHUB_OUTPUT"

  visual-critical:
    name: Visual critical
    runs-on: ubuntu-latest
    # GATE OBRIGATORIO E CURTO — entra no `release-ready`.
    #
    # PROBLEMA MEDIDO: a suite visual completa (24 specs x 3 viewports = ate 72 comparacoes)
    # levou 15m47s e virou o caminho critico depois que o build caiu para ~56s. Um ajuste de
    # densidade numa tela de Contabilidade bloqueava a promocao de uma correcao de backend por
    # 16 minutos.
    #
    # O QUE ESTE JOB COBRE (definido por RISCO OPERACIONAL, nao por "metade da suite"):
    #
    #   login     — porta de entrada. Se quebrar, ninguem entra no produto.
    #   dashboard — Central de Operacoes, primeira dobra. Se quebrar, o operador nao ve o
    #               trabalho que precisa fazer.
    #
    # Sao as duas superficies cujo defeito visual IMPEDE operacao. As demais (fiscal,
    # contabilidade, compras, proposta, inventario) quebram MODULOS — grave, mas nao impedem o
    # produto de abrir, e continuam cobertas pelo `visual-full`.
    #
    # VIEWPORT: apenas `desktop`. O critical responde "a tela ainda existe na estrutura
    # esperada?". Responsividade em 390px e pergunta legitima do `visual-full`.
    #
    # CREDIBILIDADE: `maxDiffPixelRatio: 0.01`, o MESMO da suite completa. Um critical mais
    # permissivo seria teatro.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Playwright Chromium (visual critical)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Visual critical suite
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual:critical 2>&1 | tee artifacts/ci/web-visual-critical.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual critical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-critical-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual-critical.log

  visual-full:
    name: Visual full
    runs-on: ubuntu-latest
    # COBERTURA COMPLETA, FORA DO CAMINHO CRITICO NORMAL.
    #
    # Roda os MESMOS 24 specs e os MESMOS 3 viewports de antes. NENHUM snapshot foi removido e
    # nenhum limiar foi afrouxado. O que muda e QUANDO este job bloqueia a release:
    #
    #   - OBRIGATORIO quando a mudanca toca superficie visual (apps/web/src, e2e/visual,
    #     estilos, layout, componentes de UI);
    #   - INFORMATIVO quando a mudanca e backend/non-visual — a cobertura continua rodando e
    #     continua publicada, mas nao segura a promocao de um fix que nao pode ter mexido em
    #     pixel.
    #
    # A classificacao vem de `detect-change-scope`, que le o diff do commit. Em `main` e em
    # `schedule` roda SEMPRE e como obrigatorio: a cobertura ampla precisa existir tambem fora
    # do PR, senao a divida visual se acumula entre releases.
    #
    # NUNCA usa `continue-on-error` para esconder regressao: quando o job roda por politica de
    # risco visual, o `visual-regression-ratchet` reprova o job em regressao real.
    needs: detect-change-scope
    if: >-
      always() &&
      (needs.detect-change-scope.outputs.visual_risk == 'true' ||
       github.event_name == 'push' ||
       github.event_name == 'schedule')
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium (web visual regression)
        run: pnpm --filter @cisne/web exec playwright install chromium --with-deps
      - name: Web visual regression (full suite)
        id: web-visual
        continue-on-error: true
        run: |
          mkdir -p artifacts/ci
          pnpm --filter @cisne/web test:visual 2>&1 | tee artifacts/ci/web-visual.log
        env:
          CI: 'true'
          VITE_CISNE_SURFACE: 'dev'
      - name: Upload visual regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            apps/web/test-results
            apps/web/playwright-report
            artifacts/ci/web-visual.log
      - name: Visual regression debt ratchet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_OUTCOME: ${{ steps.web-visual.outcome }}
        run: node scripts/ci/visual-regression-ratchet.mjs artifacts/ci/web-visual.log

  release-ready:
    name: Release ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # AGREGADOR OBRIGATORIO — o UNICO contrato que o CD consome.
    #
    # O CD dispara em `workflow_run: [CI] types: [completed]` e aceita qualquer conclusao
    # `success`. Sem um agregador, "a CI passou" pode significar "os jobs que rodaram passaram",
    # e um job ausente nunca reprova. Este job transforma a topologia inteira em UM veredito:
    # se qualquer gate required falhou, foi cancelado ou simplesmente nao rodou, aqui e `failure`.
    #
    # `if: always()` e deliberado: o job TEM de rodar mesmo quando um gate falha — e exatamente
    # nesse caso que ele precisa reprovar. Um `release-ready` que nao roda quando algo falha
    # seria um falso verde.
    needs:
      - static-quality
      - unit-tests
      - database-and-integration
      - api-e2e
      - build-release
      - visual-critical
    if: always()
    steps:
      - name: Require every required gate to pass
        env:
          STATIC: ${{ needs.static-quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          DATABASE: ${{ needs.database-and-integration.result }}
          E2E: ${{ needs.api-e2e.result }}
          BUILD: ${{ needs.build-release.result }}
          VISUAL_CRITICAL: ${{ needs.visual-critical.result }}
        run: |
          echo "static-quality            : $STATIC"
          echo "unit-tests                : $UNIT"
          echo "database-and-integration  : $DATABASE"
          echo "api-e2e                   : $E2E"
          echo "build-release             : $BUILD"
          echo "visual-critical           : $VISUAL_CRITICAL"
          failed=0
          for pair in \
            "static-quality:$STATIC" \
            "unit-tests:$UNIT" \
            "database-and-integration:$DATABASE" \
            "api-e2e:$E2E" \
            "build-release:$BUILD" \
            "visual-critical:$VISUAL_CRITICAL"
          do
            name="${pair%%:*}"
            result="${pair##*:}"
            if [ "$result" != "success" ]; then
              echo "::error::required gate '$name' concluded '$result' — release is NOT ready"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "release-ready: every required gate succeeded"
