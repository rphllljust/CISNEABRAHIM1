name: Production TLS hardening

on:
  workflow_run:
    workflows: [Coolify Release Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-tls-hardening
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harden:
    name: Enforce HTTPS / redirects / redaction
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Promote current public domains to HTTPS and prove browser path
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          PROD_SMOKE_LOGIN: ${{ secrets.PROD_SMOKE_LOGIN }}
          PROD_SMOKE_PASSWORD: ${{ secrets.PROD_SMOKE_PASSWORD }}
          TLS_CERTIFICATE_TIMEOUT_MS: '180000'
        run: node scripts/ops/coolify-tls-harden.mjs
