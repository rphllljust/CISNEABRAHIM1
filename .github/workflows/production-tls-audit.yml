name: Production TLS audit

on:
  workflow_dispatch:

concurrency:
  group: production-tls-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit production TLS / domains
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify Coolify runtime, domains, TLS, redirects and redaction
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WORKER_UUID: ${{ secrets.COOLIFY_WORKER_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
        run: node scripts/ops/coolify-tls-audit.mjs
